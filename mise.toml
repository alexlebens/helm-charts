[tools]
"aqua:helm/chart-testing" = "3.15.0"
bats = "1.14.0"
crane = "0.22.1"
helm = "4.3.1"
helm-docs = "1.14.2"
jactionlint = "2.6.0"
jq = "1.8.2"
kubeconform = "0.8.0"
kubectl = "1.37.2"
prettier = "3.9.10"
python = "3.15.2"
shellcheck = "0.11.0"
trivy = "0.76.2"
uv = "0.13.8"
yq = "4.54.3"

# -- Chart Management
[tasks.check-chart]
description = "Validate a Helm chart following test-charts workflow conventions"
depends = ["helm:plugins"]
run = ".mise/tasks/check-chart"

# -- Helm
[tasks."helm:plugins"]
description = "Install required Helm plugins (cm-push, unittest)"
run = ".mise/tasks/helm/plugins"

[tasks."helm:repo"]
description = "Discover and register Helm repositories required by chart dependencies"
run = ".mise/tasks/helm/repo"

[tasks."helm:dep"]
description = "Build or update Helm chart dependencies"
run = ".mise/tasks/helm/dep"

[tasks."helm:lint"]
description = "Lint Helm charts and run unit tests"
depends = ["helm:plugins"]
run = ".mise/tasks/helm/lint"

[tasks."helm:build"]
description = "Update repositories, build dependencies, and lint Helm charts"
depends = ["helm:plugins"]
run = ".mise/tasks/helm/build"

[tasks."lint:chart"]
description = "Legacy alias: lint a Helm chart"
depends = ["helm:plugins"]
run = ".mise/tasks/check-chart --step lint"

[tasks."test:chart"]
description = "Legacy alias: run chart-testing ct lint against charts"
run = ".mise/tasks/check/chart"

# -- Generation
[tasks."generate:docs"]
description = "Generate markdown documentation for Helm charts using helm-docs"
run = ".mise/tasks/generate/docs"

[tasks."schemas:generate"]
description = "Generate JSON schemas from upstream CRDs using openapi2jsonschema"
run = ".mise/tasks/generate/schemas"

# -- Check
[tasks."check:chart"]
description = "Run chart-testing ct lint against charts"
run = ".mise/tasks/check/chart"

[tasks."check:workflows"]
description = "Validate Gitea Actions workflow YAML files with jactionlint"
run = ".mise/tasks/check/workflows"

[tasks."check:kubeconform"]
description = "Validate rendered chart manifests with kubeconform against schemas"
run = ".mise/tasks/check/kubeconform"

[tasks."check:trivy"]
description = "Scan rendered Helm chart manifests with Trivy for security misconfigurations"
run = ".mise/tasks/check/trivy"

# -- Gitea CI/CD Workflow Tasks
[tasks."gitea:detect-charts"]
description = "Detect changed or targeted Helm charts for CI testing and CD releasing (CI only)"
run = ".mise/tasks/gitea/detect-charts"

[tasks."gitea:release-chart"]
description = "Package and push a Helm chart to Harbor OCI and Gitea ChartMuseum (CI only)"
depends = ["helm:plugins"]
run = ".mise/tasks/gitea/release-chart"

# -- Testing
[tasks.test]
description = "Run Bats test suite for .mise tasks and libraries"
run = "bats .mise/tests/bash/"

# -- Global configuration accessible across charts
global:
  # -- Default base domain
  domain: ".alexlebens.dev"

  # -- Default tailscale domain
  tailscaleDomain: ".boreal-beaufort.ts.net"

  # -- Base URL for dashboard and application icons
  iconUrl: "https://cdn.jsdelivr.net/gh/selfhst/icons/webp/"

  # -- Default in-cluster blackbox prober URL
  blackboxUrl: "blackbox.blackbox.svc.cluster.local:9115"

  # -- Configure default probes for internal and external endpoints
  probe:
    clusterProbe: "cl01tl"
    externalProbes:
      - "ps08rp"
      - "ps09rp"

    # -- Internal and external endpoints
    internal: ""
    external: ""

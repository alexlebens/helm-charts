# -- Global configuration accessible across charts
global:
  # -- Default base domain
  domain: ".alexlebens.dev"

  # -- Default tailscale domain
  tailscaleDomain: ".boreal-beaufort.ts.net"

  # -- Base URL for dashboard and application icons
  iconUrl: "https://cdn.jsdelivr.net/gh/selfhst/icons/webp/"

  # -- Default in-cluster blackbox prober URL
  blackboxUrl: "blackbox.blackbox.svc.cluster.local:9115"

# -- Configure default probes for internal and external endpoints
probe:
  clusterProbe: "cl01tl"
  externalProbes:
    - "ps08rp"
    - "ps09rp"

  # -- Internal and external endpoints
  internal: ""
  external: ""

# -- Configure GrafanaDashboard resources for local dashboards/*.json files or remote/inline sources (keyed by dashboard filename without .json for per-dashboard overrides)
grafanaDashboard:
  # -- Default enabled state for dashboards
  enabled: true

  # -- Target namespace for GrafanaDashboard resources
  namespace: grafana-operator

  # -- Default Grafana folder (overview, hardware, kubernetes, networking, storage, platform, applications, iot)
  folder: applications

  # -- How often Grafana Operator reconciles dashboards
  resyncPeriod: 6h

  # -- Label selector matching the target Grafana instance
  instanceSelector:
    matchLabels:
      app: grafana-main

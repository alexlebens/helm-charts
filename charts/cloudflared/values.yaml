# -- Name override of release
name: ""

# -- Protocol - Available values are auto, http2, and quic.
protocol: auto

# -- Default image
image:
  repository: cloudflare/cloudflared
  tag: 2026.10.2@sha256:0e56c13c7058fcef9c4f0e7d83372f82330548dbf8f8b366f3d8b506526d93b2
  pullPolicy: IfNotPresent

# -- Number of replicas for high availability (Cloudflare recommends at least 2)
replicas: 2

# -- Affinity configuration (defaults to podAntiAffinity across hostname topology)
affinity: {}

# -- Additional arguments to pass to the cloudflared container
extraArgs: []

# -- Default resources
resources:
  requests:
    cpu: 5m
    memory: 30Mi

# -- Pod-level security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# -- Container-level security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# -- Probes configuration
probes:
  liveness:
    enabled: true
  readiness:
    enabled: true

# -- Metrics
metrics:
  enabled: true
  prometheusRule:
    enabled: true

    # -- PrometheusRule additional labels
    labels: {}

    # -- Prometheus rules
    rules:
      - alert: CloudflaredDown
        expr: cloudflared_tunnel_active == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'Cloudflared tunnel {{ "{{" }} $labels.tunnel_id }} is down'
          description: "Cloudflared tunnel has lost connection to the edge."

# -- Probe CRD configuration (Blackbox Exporter)
probe:
  enabled: false

  # -- Probe additional labels
  labels: {}

  # -- URL of the prober
  proberUrl: blackbox-cloudflare.blackbox.svc.cluster.local:9115

  # -- Target URL to probe
  targetUrl: ""

  # -- Blackbox exporter module to use
  module: http_2xx

  # -- Scrape interval for the probe
  interval: ""

  # -- Scrape timeout for the probe
  scrapeTimeout: ""

# -- Secret configuration
secret:
  # -- External Secret configuration
  externalSecret:
    enabled: true
    nameOverride: ""

    # -- Cluster store config
    store:
      name: openbao
      path: /cloudflare/tunnels
      property: token

    # -- Add additional labels
    additionalLabels: {}

  # -- Name of existing secret that contains Cloudflare token
  existingSecret:
    name: cloudflared-secret
    key: cf-tunnel-token

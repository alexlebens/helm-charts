suite: test cloudflared ExternalSecret
templates:
  - external-secret.yaml
release:
  name: x
  namespace: ns
tests:
  - it: should render a tunnel token ExternalSecret by default
    asserts:
      - isKind:
          of: ExternalSecret
      - equal:
          path: metadata.name
          value: x-cloudflared-secret
      - equal:
          path: spec.secretStoreRef.name
          value: openbao
      - equal:
          path: spec.data[0].secretKey
          value: cf-tunnel-token
      - equal:
          path: spec.data[0].remoteRef.key
          value: /cloudflare/tunnels/x
      - equal:
          path: spec.data[0].remoteRef.property
          value: token

  - it: should not render when externalSecret is disabled
    set:
      secret:
        externalSecret:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

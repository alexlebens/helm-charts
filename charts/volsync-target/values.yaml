# -- Default pattern follows <pvcTarget>-backup
nameOverride: ""

# -- Override the namespace of the chart
namespaceOverride: ""

# -- Kubernetes cluster name
kubernetesClusterName: cl01tl

# -- Add additional labels
additionalLabels: {}

# -- Name of the PVC target
pvcTarget: "data"

# -- Global security context for restic mover
moverSecurityContext: {}

# -- Pause all backups globally across all tiers
paused: false

# -- Trigger manual backup execution across all tiers by setting an arbitrary token (e.g. "run-1")
manual: ""

# -- Global unlock token to clear stale restic repository locks across all tiers
unlock: ""

# -- Restore from backup via ReplicationDestination (defaults shared by all tiers; override per tier under `<tier>.restore`)
restore:
  # -- Restore destination PVC. Defaults to `pvcTarget`
  destinationPVC: ""

  # -- Copy method for the restore (Direct writes into destinationPVC, Snapshot creates a VolumeSnapshot)
  copyMethod: Direct

  # -- Capacity of the destination volume, only needed if the chart/volsync must provision it
  capacity: ""

  # -- Access modes for the destination volume
  accessModes: []

  # -- Storage class for the destination volume
  storageClassName: ceph-block

  # -- Volume snapshot class (used with copyMethod Snapshot)
  volumeSnapshotClassName: ceph-blockpool-snapshot

  # -- Restore the latest snapshot taken at or before this RFC-3339 timestamp (e.g. "2026-11-01T00:00:00Z")
  restoreAsOf: ""

  # -- Skip this many snapshots back from the selected one (0 = latest)
  previous: ""

  # -- Restic cache capacity for the mover
  cacheCapacity: 1Gi

  # -- Restic cache storage class
  cacheStorageClassName: ""

  # -- Restic cache access modes
  cacheAccessModes: []

  # -- Mover security context for restore
  moverSecurityContext: {}

# -- On demand restic repair Job (defaults shared by all tiers; enable per tier under `<tier>.repair`)
repair:
  # -- Image used to run restic
  image:
    repository: docker.io/restic/restic
    tag: 0.19.1
    pullPolicy: IfNotPresent

  # -- Run `restic unlock` before repairing
  unlock: true

  # -- Run `restic repair index` (rebuilds index from pack files)
  repairIndex: true

  # -- Run `restic repair snapshots --forget` (rewrites snapshots that reference missing data; DESTRUCTIVE to damaged snapshots)
  repairSnapshots: false

  # -- Run `restic check` after repair
  check: true

  # -- Optional `--read-data-subset` for restic check (e.g. "10%"); empty checks structure only
  readDataSubset: ""

  # -- Extra arguments appended to every restic command (e.g. ["--verbose"])
  extraArgs: []

  # -- Seconds before the finished Job is garbage collected
  ttlSecondsAfterFinished: 86400

  # -- Job backoff limit
  backoffLimit: 0

  # -- Job resources
  resources: {}

  # -- Job pod security context
  podSecurityContext: {}

  # -- Job container security context
  securityContext: {}

# -- Prometheus Rule
prometheusRule:
  enabled: true
  # -- Alert on delayed/stale backups based on cron schedule
  backupDelayed:
    enabled: true
    # -- Override max sync lag threshold in seconds (auto-computed from cron schedule if unset)
    maxSyncLag: ""

# -- Use external secrets
externalSecrets:
  enabled: true

# -- Tier A: On-prem Synology NAS backup configuration (ps02sn)
a:
  enabled: false

  # -- Pause backups for this tier
  paused: false

  # -- Manual backup trigger token for this tier
  manual: ""

  # -- Optional override for max sync lag threshold in seconds (auto-computed from schedule if unset)
  maxSyncLag: ""

  # -- Tier-specific mover security context
  moverSecurityContext: {}

  # -- 5 character cron schedule
  schedule: 0 8 * * *

  # -- Restore overrides for this tier. Set `enabled` and a unique `manual` token to run a restore from GitOps
  restore:
    # -- Create a ReplicationDestination for this tier
    enabled: false
    # -- Trigger token; change it to run another restore
    manual: ""

  # -- Repair Job for this tier. Set `enabled` and change `token` to run restic repair on demand
  repair:
    # -- Create the repair Job for this tier
    enabled: false
    # -- Unique token appended to the Job name; change it to re-run the repair
    token: ""

  # -- Backup configuration, inserted directly into the yaml
  restic:
    # -- Unlock token to clear stale restic repository locks for this tier
    unlock: ""
    pruneIntervalDays: 7
    repository: ""
    retain:
      hourly: 0
      daily: 7
      weekly: 4
      monthly: 0
      yearly: 0
    copyMethod: Snapshot
    storageClassName: ceph-block
    volumeSnapshotClassName: ceph-blockpool-snapshot
    cacheCapacity: 1Gi
    cacheStorageClassName: ""
    cacheAccessModes: []

  # -- External Secret configuration
  externalSecret:
    enabled: true
    storeName: openbao
    # Path containing the S3 endpoint
    bucketPath: /ps02sn/garage/config
    endpointProperty: ENDPOINT
    # Path containing the AWS/S3 credentials and RESTIC_PASSWORD
    credentialPath: /ps02sn/garage/keys/volsync-backups
    bucketProperty: BUCKET_NAME
    resticPasswordProperty: RESTIC_PASSWORD
    regionProperty: AWS_REGION
    accessKeyIdProperty: AWS_ACCESS_KEY_ID
    secretAccessKeyProperty: AWS_SECRET_ACCESS_KEY


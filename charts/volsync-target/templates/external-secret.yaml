{{- if .Values.externalSecrets.enabled }}
{{- range $tier := tuple "a" "b" "c" "d" }}
{{- $tierConfig := index $.Values $tier }}
{{- $esEnabled := true }}
{{- if and $tierConfig $tierConfig.externalSecret (hasKey $tierConfig.externalSecret "enabled") }}
  {{- $esEnabled = $tierConfig.externalSecret.enabled }}
{{- end }}
{{- if and $tierConfig $tierConfig.enabled $esEnabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "volsync.repoName" (dict "root" $ "tier" $tier) }}
  namespace: {{ include "volsync.namespace" $ }}
  labels:
    {{- include "volsync.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ include "volsync.repoName" (dict "root" $ "tier" $tier) }}
    {{- with $.Values.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ (and $tierConfig.externalSecret $tierConfig.externalSecret.storeName) | default "openbao" }}
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      mergePolicy: Merge
      engineVersion: v2
      data:
        RESTIC_REPOSITORY: "s3:{{ `{{ .ENDPOINT }}` }}/{{ `{{ .BUCKET }}` }}/{{ $.Values.kubernetesClusterName }}/{{ $.Release.Namespace }}/{{ $.Values.pvcTarget | required "PVC target is required" }}"
  data:
    - secretKey: ENDPOINT
      remoteRef:
        key: {{ $tierConfig.externalSecret.bucketPath | required (printf "External Secret Volsync %s bucketPath is required" $tier) }}
        property: {{ $tierConfig.externalSecret.endpointProperty | default "ENDPOINT" }}
    - secretKey: BUCKET
      remoteRef:
        key: {{ $tierConfig.externalSecret.credentialPath | required (printf "External Secret Volsync %s credentialPath is required" $tier) }}
        property: {{ $tierConfig.externalSecret.bucketProperty | default "BUCKET_NAME" }}
    - secretKey: RESTIC_PASSWORD
      remoteRef:
        key: {{ $tierConfig.externalSecret.credentialPath | required (printf "External Secret Volsync %s credentialPath is required" $tier) }}
        property: {{ $tierConfig.externalSecret.resticPasswordProperty | default "RESTIC_PASSWORD" }}
    - secretKey: AWS_DEFAULT_REGION
      remoteRef:
        key: {{ $tierConfig.externalSecret.credentialPath | required (printf "External Secret Volsync %s credentialPath is required" $tier) }}
        property: {{ $tierConfig.externalSecret.regionProperty | default "AWS_REGION" }}
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: {{ $tierConfig.externalSecret.credentialPath | required (printf "External Secret Volsync %s credentialPath is required" $tier) }}
        property: {{ $tierConfig.externalSecret.accessKeyIdProperty | default "AWS_ACCESS_KEY_ID" }}
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: {{ $tierConfig.externalSecret.credentialPath | required (printf "External Secret Volsync %s credentialPath is required" $tier) }}
        property: {{ $tierConfig.externalSecret.secretAccessKeyProperty | default "AWS_SECRET_ACCESS_KEY" }}
{{- end }}
{{- end }}
{{- end }}

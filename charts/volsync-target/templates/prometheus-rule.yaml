{{- if .Values.prometheusRule.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "volsync.name" . }}
  namespace: {{ include "volsync.namespace" . }}
  labels:
    app.kubernetes.io/name: {{ include "volsync.name" . }}
    {{- include "volsync.labels" . | nindent 4 }}
    {{- with .Values.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: volsync.alerts
      rules:
        - alert: VolSyncBackupPodFailed
          expr: |
            sum by (namespace) (
              (kube_pod_status_phase{namespace="{{ include "volsync.namespace" . }}", phase="Failed", pod=~"volsync-.*{{ include "volsync.name" . }}-.*"} == 1)
              * on(namespace, pod) group_left(owner_name)
              kube_pod_owner{namespace="{{ include "volsync.namespace" . }}", owner_kind="Job", owner_name=~"volsync-.*{{ include "volsync.name" . }}-.*"}
            ) > 0
          keep_firing_for: 10m
          labels:
            severity: critical
            pvc: {{ .Values.pvcTarget }}
          annotations:
            summary: "VolSync backup pod failed in {{ `{{ $labels.namespace }}` }}"
            description: |
              {{ `{{ $value }}` }} VolSync backup pod(s) failed for PVC '{{ .Values.pvcTarget }}'.
              Target: {{ include "volsync.name" . }}
              Namespace: {{ `{{ $labels.namespace }}` }}
        {{- if and .Values.prometheusRule.backupDelayed (default true .Values.prometheusRule.backupDelayed.enabled) }}
        {{- range $tier := tuple "a" "b" "c" "d" }}
        {{- $tierConfig := index $.Values $tier }}
        {{- if and $tierConfig $tierConfig.enabled }}
        {{- $thresholdSecs := include "volsync.syncLagThresholdSeconds" (dict "schedule" $tierConfig.schedule "override" (or $tierConfig.maxSyncLag $.Values.prometheusRule.backupDelayed.maxSyncLag)) | trim }}
        {{- $thresholdHuman := include "volsync.syncLagThresholdHuman" (dict "schedule" $tierConfig.schedule "override" (or $tierConfig.maxSyncLag $.Values.prometheusRule.backupDelayed.maxSyncLag)) | trim }}
        - alert: VolSyncBackupDelayed-{{ $tier }}
          expr: |
            (
              (time() - volsync_replicationsource_last_sync_time{obj_name="{{ include "volsync.name" $ }}-source-{{ $tier }}", obj_namespace="{{ include "volsync.namespace" $ }}"}) > {{ $thresholdSecs }}
            ) or (
              (time() - max by (namespace) (kube_job_status_completion_time{namespace="{{ include "volsync.namespace" $ }}", job_name=~"volsync-.*{{ include "volsync.name" $ }}-source-{{ $tier }}-.*"})) > {{ $thresholdSecs }}
            )
          for: 15m
          labels:
            severity: warning
            tier: {{ $tier }}
            pvc: {{ $.Values.pvcTarget }}
          annotations:
            summary: "VolSync backup delayed for tier {{ $tier }} in {{ `{{ $labels.namespace }}` }}"
            description: |
              VolSync backup on tier '{{ $tier }}' for PVC '{{ $.Values.pvcTarget }}' has not completed successfully in {{ $thresholdHuman }} (schedule: '{{ $tierConfig.schedule }}').
              Target: {{ include "volsync.name" $ }}-source-{{ $tier }}
              Namespace: {{ `{{ $labels.namespace }}` }}
        {{- end }}
        {{- end }}
        {{- end }}
{{- end }}

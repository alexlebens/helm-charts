suite: test volsync-target scripts ConfigMap
templates:
  - config-map.yaml
release:
  name: vs
  namespace: ns
tests:
  - it: should not render by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render the repair script when repair is enabled
    set:
      a:
        enabled: true
        repair:
          enabled: true
          token: t
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: data-backup-scripts
      - matchRegex:
          path: data["repair.sh"]
          pattern: restic check

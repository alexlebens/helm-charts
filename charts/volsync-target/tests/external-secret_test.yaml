suite: test volsync-target ExternalSecret
templates:
  - external-secret.yaml
release:
  name: vs
  namespace: ns
tests:
  - it: should not render by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render an ExternalSecret per enabled tier
    set:
      a:
        enabled: true
      b:
        enabled: true
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: ExternalSecret
      - equal:
          path: metadata.name
          value: data-backup-secret-a
        documentIndex: 0
      - equal:
          path: metadata.name
          value: data-backup-secret-b
        documentIndex: 1
      - equal:
          path: spec.data[0].remoteRef.key
          value: /ps02sn/garage/config
        documentIndex: 0
      - equal:
          path: spec.data[0].remoteRef.key
          value: /cl01tl/garage/config
        documentIndex: 1

  - it: should build the restic repository from cluster, namespace and PVC
    set:
      kubernetesClusterName: testcluster
      pvcTarget: media
      a:
        enabled: true
    asserts:
      - equal:
          path: spec.target.template.data.RESTIC_REPOSITORY
          value: "s3:{{ .ENDPOINT }}/{{ .BUCKET }}/testcluster/ns/media"

  - it: should map all restic credentials
    set:
      a:
        enabled: true
    asserts:
      - lengthEqual:
          path: spec.data
          count: 6
      - equal:
          path: spec.data[2].secretKey
          value: RESTIC_PASSWORD
      - equal:
          path: spec.data[3].secretKey
          value: AWS_DEFAULT_REGION

  - it: should not render when externalSecrets are disabled
    set:
      externalSecrets:
        enabled: false
      a:
        enabled: true
    asserts:
      - hasDocuments:
          count: 0

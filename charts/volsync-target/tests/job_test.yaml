suite: test volsync-target repair Job
templates:
  - job.yaml
release:
  name: vs
  namespace: ns
tests:
  - it: should not render by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render a repair Job with the token in its name
    set:
      a:
        enabled: true
        repair:
          enabled: true
          token: tok1
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Job
      - equal:
          path: metadata.name
          value: data-backup-repair-a-tok1
      - equal:
          path: spec.backoffLimit
          value: 0
      - equal:
          path: spec.ttlSecondsAfterFinished
          value: 86400
      - equal:
          path: spec.template.spec.restartPolicy
          value: Never
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/restic/restic:0.19.1
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.name
          value: data-backup-secret-a
      - equal:
          path: spec.template.spec.containers[0].command
          value:
            - /bin/sh
            - /scripts/repair.sh

  - it: should honor repair flags
    set:
      a:
        enabled: true
        repair:
          enabled: true
          token: t
      repair:
        repairSnapshots: true
        check: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REPAIR_SNAPSHOTS
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CHECK
            value: "false"

suite: test OpenBao Seed Job
templates:
  - seed-job.yaml
tests:
  - it: should not render Job by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render Job when enabled
    set:
      seedJob:
        enabled: true
    release:
      name: my-app
      namespace: my-namespace
    asserts:
      - isKind:
          of: Job
      - equal:
          path: metadata.name
          value: my-app-pocket-id-seed
      - equal:
          path: metadata.namespace
          value: my-namespace
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation,hook-succeeded
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-5"
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook"]
          value: PreSync
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook-delete-policy"]
          value: BeforeHookCreation,HookSucceeded
      - equal:
          path: spec.template.spec.serviceAccountName
          value: pocket-id-seed
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].command
          value:
            - /bin/sh
            - /scripts/seed.sh
      - equal:
          path: spec.template.spec.volumes[0].name
          value: scripts
      - equal:
          path: spec.template.spec.volumes[0].configMap.name
          value: my-app-seed-scripts

  - it: should respect custom serviceAccount name
    set:
      seedJob:
        enabled: true
        serviceAccount:
          name: custom-seed-sa
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: custom-seed-sa

  - it: should configure custom vault role
    set:
      seedJob:
        enabled: true
        vaultRole: my-custom-role
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAULT_ROLE
            value: my-custom-role

  - it: should configure default vault mount
    set:
      seedJob:
        enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAULT_MOUNT
            value: secret

  - it: should configure custom vault mount
    set:
      seedJob:
        enabled: true
        vaultMount: custom-mount
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAULT_MOUNT
            value: custom-mount

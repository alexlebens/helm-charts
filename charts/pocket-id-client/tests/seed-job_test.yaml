suite: test OpenBao Seed Job
templates:
  - seed-job.yaml
tests:
  - it: should not render Job by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render Job when enabled
    set:
      seedJob:
        enabled: true
    release:
      name: my-app
      namespace: my-namespace
    asserts:
      - isKind:
          of: Job
      - equal:
          path: metadata.name
          value: my-app-pocket-id-seed
      - equal:
          path: metadata.namespace
          value: my-namespace
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation,hook-succeeded
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-5"
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook"]
          value: PreSync
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook-delete-policy"]
          value: BeforeHookCreation,HookSucceeded
      - equal:
          path: spec.template.spec.serviceAccountName
          value: pocket-id-seed
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true

  - it: should respect custom serviceAccount name
    set:
      seedJob:
        enabled: true
        serviceAccount:
          name: custom-seed-sa
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: custom-seed-sa

  - it: should configure custom vault role
    set:
      seedJob:
        enabled: true
        vaultRole: my-custom-role
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'role="my-custom-role"'

  - it: should authenticate with service account jwt
    set:
      seedJob:
        enabled: true
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'jwt="\$\(cat /var/run/secrets/kubernetes.io/serviceaccount/token\)"'
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'bao kv get -mount="secret"'
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'bao kv put -mount="secret"'

  - it: should configure custom vault mount
    set:
      seedJob:
        enabled: true
        vaultMount: custom-mount
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'bao kv get -mount="custom-mount"'
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'bao kv put -mount="custom-mount"'

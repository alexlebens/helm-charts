suite: test Seed Job ServiceAccount
templates:
  - service-account.yaml
tests:
  - it: should not render ServiceAccount by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render ServiceAccount when seedJob is enabled
    set:
      seedJob:
        enabled: true
    release:
      name: my-app
      namespace: my-namespace
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: pocket-id-seed
      - equal:
          path: metadata.namespace
          value: my-namespace
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-install
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-10"

  - it: should not render ServiceAccount when create is false
    set:
      seedJob:
        enabled: true
        serviceAccount:
          create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should respect custom serviceAccount name
    set:
      seedJob:
        enabled: true
        serviceAccount:
          name: custom-seed-sa
    asserts:
      - equal:
          path: metadata.name
          value: custom-seed-sa

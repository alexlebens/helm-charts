suite: test ExternalSecret
templates:
  - external-secret.yaml
tests:
  - it: should not render when externalSecret is disabled
    set:
      externalSecret:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should render default ExternalSecret in oauth mode
    release:
      name: my-app
      namespace: my-namespace
    asserts:
      - isKind:
          of: ExternalSecret
      - equal:
          path: metadata.name
          value: my-app-oauth-proxy
      - equal:
          path: metadata.namespace
          value: my-namespace
      - equal:
          path: spec.secretStoreRef.kind
          value: ClusterSecretStore
      - equal:
          path: spec.secretStoreRef.name
          value: openbao
      - equal:
          path: spec.data[0].secretKey
          value: OAUTH2_PROXY_CLIENT_ID
      - equal:
          path: spec.data[0].remoteRef.key
          value: /cl01tl/pocket-id/oidc/my-namespace
      - equal:
          path: spec.data[0].remoteRef.property
          value: clientId
      - equal:
          path: spec.data[1].secretKey
          value: OAUTH2_PROXY_CLIENT_SECRET
      - equal:
          path: spec.data[1].remoteRef.key
          value: /cl01tl/pocket-id/oidc/my-namespace
      - equal:
          path: spec.data[1].remoteRef.property
          value: clientSecret
      - equal:
          path: spec.data[2].secretKey
          value: OAUTH2_PROXY_COOKIE_SECRET
      - equal:
          path: spec.data[2].remoteRef.key
          value: /cl01tl/pocket-id/oidc/my-namespace
      - equal:
          path: spec.data[2].remoteRef.property
          value: cookie
      - equal:
          path: spec.data[3].secretKey
          value: OAUTH2_PROXY_OIDC_ISSUER_URL
      - equal:
          path: spec.data[3].remoteRef.key
          value: /cl01tl/pocket-id/config
      - equal:
          path: spec.data[3].remoteRef.property
          value: issuer-url

  - it: should render ExternalSecret in oidc mode
    release:
      name: my-app
      namespace: my-namespace
    set:
      mode: oidc
    asserts:
      - equal:
          path: metadata.name
          value: my-app-oidc-secret
      - equal:
          path: spec.data[0].secretKey
          value: clientId
      - equal:
          path: spec.data[0].remoteRef.key
          value: /cl01tl/pocket-id/oidc/my-namespace
      - equal:
          path: spec.data[1].secretKey
          value: clientSecret
      - equal:
          path: spec.data[1].remoteRef.key
          value: /cl01tl/pocket-id/oidc/my-namespace

  - it: should respect secretPath override over prefix
    release:
      name: my-app
      namespace: my-namespace
    set:
      externalSecret:
        secretPath: /custom/path/to/secret
    asserts:
      - equal:
          path: spec.data[0].remoteRef.key
          value: /custom/path/to/secret

  - it: should respect secretName and key overrides in oidc mode
    release:
      name: my-app
    set:
      mode: oidc
      externalSecret:
        secretName: custom-secret
        clientIdKey: CUSTOM_CLIENT_ID
        clientSecretKey: CUSTOM_CLIENT_SECRET
    asserts:
      - equal:
          path: metadata.name
          value: custom-secret
      - equal:
          path: spec.data[0].secretKey
          value: CUSTOM_CLIENT_ID
      - equal:
          path: spec.data[1].secretKey
          value: CUSTOM_CLIENT_SECRET

  - it: should render extraData entries
    release:
      name: my-app
      namespace: my-namespace
    set:
      externalSecret:
        extraData:
          - secretKey: OIDC_SCOPES
            remoteRef:
              key: /cl01tl/pocket-id/oidc/my-namespace
              property: scopes
    asserts:
      - equal:
          path: spec.data[4].secretKey
          value: OIDC_SCOPES
      - equal:
          path: spec.data[4].remoteRef.key
          value: /cl01tl/pocket-id/oidc/my-namespace
      - equal:
          path: spec.data[4].remoteRef.property
          value: scopes

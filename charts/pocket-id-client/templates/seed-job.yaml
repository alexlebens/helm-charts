{{- if .Values.seedJob.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "pocketIdClient.name" . }}-pocket-id-seed
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "pocketIdClient.name" . }}-pocket-id-seed
    {{- include "pocketIdClient.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "-5"
    "argocd.argoproj.io/hook": PreSync
    "argocd.argoproj.io/hook-delete-policy": BeforeHookCreation,HookSucceeded
spec:
  ttlSecondsAfterFinished: 120
  backoffLimit: 3
  template:
    metadata:
      name: {{ include "pocketIdClient.name" . }}-pocket-id-seed
      labels:
        app.kubernetes.io/name: {{ include "pocketIdClient.name" . }}-pocket-id-seed
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "pocketIdClient.seedServiceAccountName" . }}
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          image: "{{ .Values.seedJob.image.repository }}:{{ .Values.seedJob.image.tag }}"
          env:
            - name: HOME
              value: /home/vault
            - name: VAULT_ADDR
              value: "{{ .Values.seedJob.vaultAddr }}"
            - name: VAULT_ROLE
              value: "{{ .Values.seedJob.vaultRole }}"
            - name: AUTH_PATH
              value: "{{ .Values.seedJob.authPath }}"
            - name: VAULT_MOUNT
              value: "{{ .Values.seedJob.vaultMount }}"
            - name: SECRET_PATH
              value: "{{ include "pocketIdClient.secretPath" . }}"
            - name: CLIENT_ID
              value: "{{ include "pocketIdClient.clientID" . }}"
            - name: MODE
              value: "{{ .Values.mode }}"
            - name: APP_NAME
              value: "{{ include "pocketIdClient.name" . }}"
          command:
            - /bin/sh
            - /scripts/seed.sh
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          {{- with .Values.seedJob.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts/seed.sh
              subPath: seed.sh
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/vault
      volumes:
        - name: scripts
          configMap:
            name: {{ include "pocketIdClient.name" . }}-seed-scripts
            defaultMode: 0755
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: home
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
{{- end }}

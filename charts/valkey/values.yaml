valkey:
  nameOverride: ""
  image:
    registry: docker.io
    repository: valkey/valkey
    tag: 9.1.2@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
  serviceAccount:
    create: true
  resources:
    requests:
      cpu: 10m
      memory: 20Mi
  dataStorage:
    enabled: false
    requestedSize: 1Gi
    className: ceph-block
    accessModes:
      - ReadWriteOnce
    keepPvc: false
  replica:
    enabled: true
    replicas: 2
    persistence:
      size: 1Gi
      storageClass: ceph-block
      accessModes:
        - ReadWriteOnce
  metrics:
    enabled: true
    exporter:
      image:
        registry: ghcr.io
        repository: oliver006/redis_exporter
        tag: v1.91.1@sha256:c67a432dba6b4ae30f471e3c77cf14a289133bbeeb89abb0bb03e6092efb2836
      resources:
        requests:
          cpu: 1m
          memory: 10M
    serviceMonitor:
      enabled: true
    podMonitor:
      enabled: false
    prometheusRule:
      enabled: true
      rules:
        - alert: ValkeyDown
          annotations:
            summary: Valkey instance {{ "{{ $labels.instance }}" }} down
            description: Valkey instance {{ "{{ $labels.instance }}" }} is down.
          expr: |
            redis_up{service="{{ include "valkey.fullname" . }}-metrics"} == 0
          for: 2m
          labels:
            severity: error
        - alert: ValkeyMemoryHigh
          annotations:
            summary: Valkey instance {{ "{{ $labels.instance }}" }} is using too much memory
            description: |
              Valkey instance {{ "{{ $labels.instance }}" }} is using {{ "{{ $value }}" }}% of its available memory.
          expr: |
            redis_memory_used_bytes{service="{{ include "valkey.fullname" . }}-metrics"} * 100
            /
            redis_memory_max_bytes{service="{{ include "valkey.fullname" . }}-metrics"}
            > 90 <= 100
          for: 2m
          labels:
            severity: error
        - alert: ValkeyKeyEviction
          annotations:
            summary: Valkey instance {{ "{{ $labels.instance }}" }} has evicted keys
            description: |
              Valkey instance {{ "{{ $labels.instance }}" }} has evicted {{ "{{ $value }}" }} keys in the last 5 minutes.
          expr: |
            increase(redis_evicted_keys_total{service="{{ include "valkey.fullname" . }}-metrics"}[5m]) > 0
          for: 1s
          labels:
            severity: error
        - alert: ValkeyBgSaveFailed
          annotations:
            summary: Valkey instance {{ "{{ $labels.instance }}" }} background save failed
            description: |
              Valkey instance {{ "{{ $labels.instance }}" }} failed to write its RDB file to disk.
              This usually indicates storage exhaustion or permission issues, and causes Valkey to stop accepting writes.
          expr: |
            redis_rdb_last_bgsave_status{service="{{ include "valkey.fullname" . }}-metrics"} == 0
          for: 5m
          labels:
            severity: critical

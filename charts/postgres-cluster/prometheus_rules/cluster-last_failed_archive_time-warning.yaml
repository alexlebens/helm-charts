{{- $alert := "CNPGClusterLastFailedArchiveTimeWarning" -}}
{{- if not (has $alert .excludeRules) -}}
alert: {{ $alert }}
annotations:
  summary: CNPG Cluster last time archiving failed.
  description: |-
    WAL archiving has been failing for more than 15 minutes on {{ .labels.pod }}.
expr: |
  (cnpg_pg_stat_archiver_last_failed_time{namespace="{{ .namespace }}", pod=~"{{ .podSelector }}"} - cnpg_pg_stat_archiver_last_archived_time{namespace="{{ .namespace }}", pod=~"{{ .podSelector }}"}) > 0
for: 15m
labels:
  severity: warning
  namespace: {{ .namespace }}
  cnpg_cluster: {{ .cluster }}
{{- range $key, $val := .additionalLabels }}
  {{ $key }}: {{ $val | toString | quote }}
{{- end }}
{{- end -}}

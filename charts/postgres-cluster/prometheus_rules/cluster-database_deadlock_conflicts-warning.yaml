{{- $alert := "CNPGClusterDatabaseDeadlockConflictsWarning" -}}
{{- if not (has $alert .excludeRules) -}}
alert: {{ $alert }}
annotations:
  summary: CNPG Cluster has over 10 deadlock conflicts.
  description: |-
    There were {{ .value }} deadlock conflicts in the last 5 minutes on {{ .labels.pod }}.
expr: |
  increase(cnpg_pg_stat_database_deadlocks{namespace="{{ .namespace }}", pod=~"{{ .podSelector }}"}[5m]) > 10
for: 1m
labels:
  severity: warning
  namespace: {{ .namespace }}
  cnpg_cluster: {{ .cluster }}
{{- range $key, $val := .additionalLabels }}
  {{ $key }}: {{ $val | toString | quote }}
{{- end }}
{{- end -}}

{{- $alert := "CNPGClusterLongRunningTransactionWarning" -}}
{{- if not (has $alert .excludeRules) -}}
alert: {{ $alert }}
annotations:
  summary: CNPG Cluster query is taking longer than 5 minutes.
  description: |-
    CloudNativePG Cluster Pod {{ .labels.pod }}
    is taking {{ .value }}s (more than 5 minutes) for a query.
expr: |-
  cnpg_backends_max_tx_duration_seconds{namespace="{{ .namespace }}", pod=~"{{ .podSelector }}"} > 300
for: 1m
labels:
  severity: warning
  namespace: {{ .namespace }}
  cnpg_cluster: {{ .cluster }}
{{- range $key, $val := .additionalLabels }}
  {{ $key }}: {{ $val | toString | quote }}
{{- end }}
{{- end -}}

# -- Override the name of the cluster
nameOverride: ""

# -- Override the namespace of the chart
namespaceOverride: ""

# -- Kubernetes cluster name
kubernetesClusterName: cl01tl

# -- Type of the CNPG database. Available types:
# * `postgresql`
type: postgresql

# -- Cluster mode of operation. Available modes:
# * `standalone` - Default mode. Creates new or updates an existing CNPG cluster.
# * `recovery` - Same as standalone but creates a cluster from a backup, object store or via pg_basebackup
mode: standalone

# -- Name of the ClusterSecretStore to use for ExternalSecret resources
externalSecretStoreName: openbao

# -- Cluster settings
cluster:
  instances: 3

  # -- Reference an existing ClusterImageCatalog or ImageCatalog (recommended for centralized patch/minor updates).
  # Mutually exclusive with `cluster.image`. Setting `cluster.image.repository` or `cluster.image.tag` takes
  # precedence and renders `spec.imageName` instead, so custom images (e.g. PostGIS, VectorChord) work without
  # clearing `imageCatalogRef`.
  imageCatalogRef:
    # -- API group for the referenced catalog
    apiGroup: postgresql.cnpg.io
    # -- Kind of catalog to reference: `ClusterImageCatalog` or `ImageCatalog`
    kind: ClusterImageCatalog
    # -- Name of the ClusterImageCatalog or ImageCatalog (leave empty to require `cluster.image` or `imageCatalog.create`)
    name: postgresql-standard-trixie
    # -- PostgreSQL major version to select from the catalog (bump this to trigger an in-place major upgrade)
    major: 19

  # -- Direct operand image override (mutually exclusive with `cluster.imageCatalogRef` and `imageCatalog.create`).
  # Leave empty to use `cluster.imageCatalogRef`. Set `tag` (and optionally `repository`, which defaults to
  # `ghcr.io/cloudnative-pg/postgresql`) to pin a custom image directly via `spec.imageName`.
  image:
    repository: ""
    tag: ""

  # -- Image pull policy. One of Always, Never or IfNotPresent. If not defined, it defaults to IfNotPresent. Cannot be updated.
  # More info: https://kubernetes.io/docs/concepts/containers/images#updating-images
  imagePullPolicy: IfNotPresent

  # -- The list of pull secrets to be used to pull the images.
  # See: https://cloudnative-pg.io/documentation/current/cloudnative-pg.v1/#postgresql-cnpg-io-v1-LocalObjectReference
  imagePullSecrets: []

  # -- Default storage size
  storage:
    size: 10Gi
    storageClass: local-path

    # -- Enable resizing existing PVCs in-place (leave null for CNPG default true; set false for StorageClasses that do not support expansion)
    resizeInUseVolumes: null

  walStorage:
    enabled: true
    size: 2Gi
    storageClass: local-path

    # -- Enable resizing existing WAL PVCs in-place (leave null for CNPG default true)
    resizeInUseVolumes: null

  # -- The UID and GID of the postgres user inside the image, defaults to 26
  postgresUID: -1
  postgresGID: -1

  # -- Customization of service definitions. Please refer to https://cloudnative-pg.io/documentation/current/service_management/
  services: {}

  # -- Inline PostgreSQL roles managed via Cluster spec.managed.roles (alternative to standalone DatabaseRole CRDs under top-level roles)
  # See: https://cloudnative-pg.io/documentation/current/cloudnative-pg.v1/#postgresql-cnpg-io-v1-RoleConfiguration
  roles: []

  # -- Replication slot management configuration (highAvailability, synchronizeReplicas, updateInterval)
  # See: https://cloudnative-pg.io/documentation/current/cloudnative-pg.v1/#postgresql-cnpg-io-v1-ReplicationSlotsConfiguration
  replicationSlots: {}

  # -- Resources requirements of every generated Pod.
  # Please refer to https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/ for more information.
  # We strongly advise you use the same setting for limits and requests so that your cluster pods are given a Guaranteed QoS.
  # See: https://kubernetes.io/docs/concepts/workloads/pods/pod-qos/
  resources:
    requests:
      cpu: 25m
      memory: 256Mi

  priorityClassName: ""

  # -- Extra environment variables injected into PostgreSQL instance containers
  env: []

  # -- Extra ConfigMap/Secret envFrom sources injected into PostgreSQL instance containers
  envFrom: []

  # -- Method to follow to upgrade the primary server during a rolling update procedure, after all replicas have been
  # successfully updated. It can be switchover (default) or restart.
  primaryUpdateMethod: switchover

  # -- Strategy to follow to upgrade the primary server during a rolling update procedure, after all replicas have been
  # successfully updated: it can be automated (unsupervised - default) or manual (supervised)
  primaryUpdateStrategy: unsupervised

  # -- Maximum time in seconds to wait for PostgreSQL to start up (leave null for CNPG default)
  startDelay: null

  # -- Maximum time in seconds to wait for PostgreSQL to shut down gracefully (leave null for CNPG default)
  stopDelay: null

  # -- Time in seconds allocated to the smart shutdown phase before fast shutdown; accepts 0 (leave null for CNPG default)
  smartShutdownTimeout: null

  # -- Time in seconds to wait for a switchover before forcing it (leave null for CNPG default)
  switchoverDelay: null

  # -- Time in seconds to wait before promoting a new primary on failover (leave null for CNPG default)
  failoverDelay: null

  # -- The instances' log level, one of the following values: error, warning, info (default), debug, trace
  logLevel: "info"

  # -- Affinity/Anti-affinity rules for Pods.
  # See: https://cloudnative-pg.io/documentation/current/cloudnative-pg.v1/#postgresql-cnpg-io-v1-AffinityConfiguration
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname

  # -- Pod topology spread constraints for scheduling across zones/hosts
  topologySpreadConstraints: []

  # -- Node maintenance window configuration (inProgress, reusePVC), useful during Talos/Kubernetes node upgrades
  # See: https://cloudnative-pg.io/documentation/current/cloudnative-pg.v1/#postgresql-cnpg-io-v1-NodeMaintenanceWindow
  nodeMaintenanceWindow: {}

  # -- The configuration for the CA and related certificates.
  # See: https://cloudnative-pg.io/documentation/current/cloudnative-pg.v1/#postgresql-cnpg-io-v1-CertificatesConfiguration
  certificates: {}

  # -- When this option is enabled, the operator will use the SuperuserSecret to update the postgres user password.
  # If the secret is not present, the operator will automatically create one.
  # When this option is disabled, the operator will ignore the SuperuserSecret content, delete it when automatically created,
  # and then blank the password of the postgres user by setting it to NULL.
  enableSuperuserAccess: false
  superuserSecret: ""

  # -- Allow to disable PDB, mainly useful for upgrade of single-instance clusters or development purposes
  # See: https://cloudnative-pg.io/documentation/current/kubernetes_upgrade/#pod-disruption-budgets
  enablePDB: true

  # -- SeccompProfile applied to every Pod and Container (defaults to RuntimeDefault)
  seccompProfile:
    type: RuntimeDefault

  # -- Additional pod-level SecurityContext settings
  podSecurityContext: {}

  # -- Additional container-level SecurityContext settings
  securityContext: {}

  # -- Custom startup, readiness, and liveness probe overrides for PostgreSQL pods
  probes: {}

  # -- Name of an existing ServiceAccount to use (mutually exclusive with serviceAccountTemplate)
  serviceAccountName: ""

  # -- Template to customize the operator-managed ServiceAccount (mutually exclusive with serviceAccountName)
  serviceAccountTemplate: {}

  # -- Enable default monitoring and alert rules
  monitoring:
    # -- Whether to enable monitoring
    enabled: true

    podMonitor:
      # -- Whether to enable the PodMonitor
      enabled: true

      # --The list of relabelings for the PodMonitor.
      # Applied to samples before scraping.
      relabelings: []

      # -- The list of metric relabelings for the PodMonitor.
      # Applied to samples before ingestion.
      metricRelabelings: []

    # -- Prometheus rule
    prometheusRule:
      # -- Whether to enable the PrometheusRule automated alerts
      enabled: true

      # -- Exclude specified rules
      excludeRules:
        - CNPGClusterLastFailedArchiveTimeWarning

    # -- Whether the default queries should be injected.
    # Set it to true if you don't want to inject default queries into the cluster.
    disableDefaultQueries: false

    # -- Custom Prometheus metrics
    # Will be stored in the ConfigMap
    customQueries: []
    #  - name: "pg_cache_hit_ratio"
    #    query: "SELECT current_database() as datname, sum(heap_blks_hit) / (sum(heap_blks_hit) + sum(heap_blks_read)) as ratio FROM pg_statio_user_tables;"
    #    metrics:
    #      - datname:
    #          usage: "LABEL"
    #          description: "Name of the database"
    #      - ratio:
    #          usage: GAUGE
    #          description: "Cache hit ratio"

    # -- The list of secrets containing the custom queries
    customQueriesSecret: []
    #  - name: custom-queries-secret
    #    key: custom-queries

  # -- Parameters to be set for the database itself
  # See: https://cloudnative-pg.io/documentation/current/cloudnative-pg.v1/#postgresql-cnpg-io-v1-PostgresConfiguration
  postgresql:
    # -- PostgreSQL configuration options (postgresql.conf)
    parameters:
      shared_buffers: 128MB
      max_slot_wal_keep_size: 2000MB
      hot_standby_feedback: "on"
      archive_timeout: "30min"
      checkpoint_timeout: "15min"
      wal_compression: "zstd"

    # -- Quorum-based Synchronous Replication
    synchronous: {}
      # method: any
      # number: 1

    # -- Lists of shared preload libraries to add to the default ones
    shared_preload_libraries: []
      # - pgaudit

    # -- List of pg_hba.conf rules
    pg_hba: []
      # - host all all all md5

    # -- List of pg_ident.conf user name map rules
    pg_ident: []
      # - mymap /^(.*)@example\.com$ \1

    # -- LDAP authentication configuration
    ldap: {}
      # server: ldap.example.com
      # port: 389
      # scheme: ldap
      # bindAsAuth:
      #   prefix: "uid="
      #   suffix: ",ou=people,dc=example,dc=com"

    # -- List of OCI Image Volume extensions to mount into PostgreSQL pods (requires PostgreSQL 18+ and Kubernetes 1.35+ ImageVolume)
    # See: https://cloudnative-pg.io/documentation/current/imagevolume_extensions/
    extensions: []
      # - name: pgvector
      # - name: postgis
      #   image:
      #     reference: ghcr.io/cloudnative-pg/postgis-extension:3.7.0-202611201143-18-trixie
      #   ld_library_path:
      #     - system
      #   env:
      #     - name: GDAL_DATA
      #       value: ${image_root}/share/gdal

    # -- Maximum number of seconds to wait when promoting a standby to primary (leave null for CNPG default)
    promotionTimeout: null

    # -- Allow invoking ALTER SYSTEM on the cluster (for debugging/troubleshooting only)
    enableAlterSystem: false

  # -- Bootstrap is the configuration of the bootstrap process when initdb is used.
  # See: https://cloudnative-pg.io/documentation/current/bootstrap/
  # See: https://cloudnative-pg.io/documentation/current/cloudnative-pg.v1/#postgresql-cnpg-io-v1-bootstrapinitdb
  initdb:
    database: app
    owner: app
    postInitApplicationSQL: []
    postInitTemplateSQL: []

  additionalLabels: {}
  annotations: {}

  # -- Metadata inherited by all objects created by the CNPG Cluster (including pods)
  inheritedMetadata:
    # -- Labels inherited by all objects created by the CNPG Cluster
    labels: {}
    # -- Annotations inherited by all objects created by the CNPG Cluster (merged over chart defaults)
    annotations: {}

# -- Recovery settings when booting cluster from external cluster
recovery:
  # -- Available recovery methods:
  # * `backup` - Recovers a CNPG cluster from a CNPG backup (PITR supported) Needs to be on the same cluster in the same namespace.
  # * `objectStore` - Recovers a CNPG cluster from a barman object store (PITR supported).
  # * `import` - Import one or more databases from an existing Postgres cluster.
  method: objectStore

  # See https://cloudnative-pg.io/documentation/current/recovery/#recovery-from-a-backup-object
  backup:
    # -- Point in time recovery target. Specify one of the following:
    pitrTarget:
      # -- Time in RFC3339 format
      time: ""

    # -- Name of the database used by the application. Default: `app`.
    database: app

    # -- Name of the owner of the database in the instance to be used by applications. Defaults to the value of the `database` key.
    owner: ""

    # -- Name of the backup to recover from.
    backupName: ""

  # See https://cloudnative-pg.io/documentation/current/recovery/#recovery-from-an-object-store
  objectStore:
    enabled: true

    # -- Point in time recovery target. Specify one of the following:
    pitrTarget:
      # -- Time in RFC3339 format
      time: ""

    # -- Name of the database used by the application. Default: `app`.
    database: app

    # -- Name of the owner of the database in the instance to be used by applications. Defaults to the value of the `database` key.
    owner: ""

    # -- Destination bucket
    destinationBucket: postgres-backups

    # -- Overrides the provider specific default path. Defaults to:
    # S3: s3://<bucket><path>
    # Azure: https://<storageAccount>.<serviceName>.core.windows.net/<containerName><path>
    # Google: gs://<bucket><path>
    destinationPathOverride: ""

    # -- Overrides the provider specific default endpoint. Defaults to:
    # S3: https://s3.<region>.amazonaws.com"
    # Leave empty if using the default S3 endpoint
    endpointURL: http://synology.alexlebens.dev:3900

    # -- Configure S3 credentials
    endpointCredentials:
      # -- Override secret name that contains S3 credentials
      name: ""

      # -- Generates an ExternalSecret if external secrets are enabled.
      createExternalSecret: true

      # -- If the S3 endpoint require the ACCESS_REGION variable set in credentials
      includeRegion: true

      # -- Path in the external secret store that contains the keys ACCESS_KEY_ID and ACCESS_SECRET_KEY
      externalSecretCredentialPath: /ps02sn/garage/keys/postgres-backups

    # -- Specifies a CA bundle to validate a privately signed certificate.
    endpointCA:
      # -- Name and key of existing secret containing the certificate.
      name: ""
      key: ""

      # -- Generates an ExternalSecret if external secrets are enabled.
      createExternalSecret: false

      # -- Path to the secret in the external secret store if external secrets are enabled.
      externalSecretCredentialPath: ""

      # -- Property within the external secret that contains the CA certificate.
      externalSecretProperty: "ca.crt"

    # -- Recovery backup index used in default serverName: <cluster.name>-pg<major>-backup-<index>
    index: 1

    # -- Override the base cluster name (without -cluster suffix) for recovery destination path and serverName; defaults to cluster.name
    clusterName: ""

    # -- Override the recovery Barman serverName explicitly (e.g. when restoring from a legacy versioned backup)
    serverNameOverride: ""

    # -- Configuration for the Barman Cloud sidecar container used during recovery
    # See: https://cloudnative-pg.io/plugin-barman-cloud/docs/
    instanceSidecarConfiguration:
      # -- Environment variables passed to the Barman Cloud recovery sidecar (defaults disable AWS S3 checksums for non-AWS S3 compatibility; see cloudnative-pg#8599)
      env:
        - name: AWS_REQUEST_CHECKSUM_CALCULATION
          value: when_required
        - name: AWS_RESPONSE_CHECKSUM_VALIDATION
          value: when_required
      # -- Resource requests and limits for the Barman Cloud recovery sidecar container
      resources: {}
      #  requests:
      #    cpu: 10m
      #    memory: 64Mi
      # -- Log level for the Barman Cloud recovery sidecar (`error`, `warning`, `info`, `debug`, `trace`)
      logLevel: ""
      # -- Additional command-line arguments appended to the Barman Cloud recovery sidecar container
      additionalContainerArgs: []

    # -- Storage
    wal:
      # -- WAL compression method. One of `` (for no compression), `gzip`, `bzip2` or `snappy`.
      compression: snappy

      # -- Whether to instruct the storage provider to encrypt WAL files. One of `` (use the storage container default), `AES256` or `aws:kms`.
      encryption: ""

      # -- Number of WAL files to be archived or restored in parallel.
      maxParallel: 1

    data:
      # -- Data compression method. One of `` (for no compression), `gzip`, `bzip2` or `snappy`.
      compression: snappy

      # -- Whether to instruct the storage provider to encrypt data files. One of `` (use the storage container default), `AES256` or `aws:kms`.
      encryption: ""

      # -- Number of data files to be archived or restored in parallel.
      jobs: 1

  # See: https://cloudnative-pg.io/documentation/current/cloudnative-pg.v1/#postgresql-cnpg-io-v1-Import
  import:
    # -- One of `microservice` or `monolith.`
    # See: https://cloudnative-pg.io/documentation/current/database_import/#how-it-works
    type: "microservice"

    # -- Databases to import
    databases: []

    # -- Roles to import
    roles: []

    # -- List of SQL queries to be executed as a superuser in the application database right after is imported.
    # To be used with extreme care. Only available in microservice type.
    postImportApplicationSQL: []

    # -- When set to true, only the pre-data and post-data sections of pg_restore are invoked, avoiding data import.
    schemaOnly: false

    # -- List of custom options to pass to the `pg_dump` command. IMPORTANT: Use these options with caution and at your
    # own risk, as the operator does not validate their content. Be aware that certain options may conflict with the
    # operator's intended functionality or design.
    pgDumpExtraOptions: []

    # -- List of custom options to pass to the `pg_restore` command. IMPORTANT: Use these options with caution and at
    # your own risk, as the operator does not validate their content. Be aware that certain options may conflict with the
    # operator's intended functionality or design.
    pgRestoreExtraOptions: []

    # -- Configuration for the source database
    source:
      host: ""
      port: 5432
      username: app
      database: app
      sslMode: "verify-full"
      # -- Name and key of the existing secret containing the password
      passwordSecret:
        name: ""
        key: "password"
      sslKeySecret:
        name: ""
        key: ""
      sslCertSecret:
        name: ""
        key: ""
      sslRootCertSecret:
        name: ""
        key: ""

# -- Backup settings
backup:
  # -- Method to create backups, options currently are only objectStore
  method: objectStore

  # -- Override name of the backup server, usually this does not need to be used.
  backupServerName: ""

  # -- Options for object store backups
  objectStore:
    enabled: true

    # -- Destination bucket
    destinationBucket: postgres-backups

    # -- Overrides the provider specific default path. Defaults to:
    # S3: s3://<bucket><path>
    # Azure: https://<storageAccount>.<serviceName>.core.windows.net/<containerName><path>
    # Google: gs://<bucket><path>
    destinationPathOverride: ""

    # -- Overrides the provider specific default endpoint.
    endpointURL: http://synology.alexlebens.dev:3900

    # -- Configure S3 credentials
    endpointCredentials:
      # -- Override secret name that contains S3 credentials
      name: ""

      # -- Generates an ExternalSecret if external secrets are enabled.
      createExternalSecret: true

      # -- If the S3 endpoint require the ACCESS_REGION variable set in credentials
      includeRegion: true

      # -- Path in the external secret store that contains the keys ACCESS_KEY_ID and ACCESS_SECRET_KEY
      externalSecretCredentialPath: /ps02sn/garage/keys/postgres-backups

    # -- Specifies a CA bundle to validate a privately signed certificate.
    endpointCA:
      # -- Name and key of existing secret containing the certificate.
      name: ""
      key: ""

      # -- Generates an ExternalSecret if external secrets are enabled.
      createExternalSecret: false

      # -- Path to the secret in the external secret store if external secrets are enabled.
      externalSecretCredentialPath: ""

      # -- Property within the external secret that contains the CA certificate.
      externalSecretProperty: "ca.crt"

    # -- Backup index used in default serverName: <cluster.name>-pg<major>-backup-<index>
    index: 1

    # -- Retention policy for backups
    retentionPolicy: "7d"

    # -- Configuration for the Barman Cloud sidecar container running inside each PostgreSQL pod
    # See: https://cloudnative-pg.io/plugin-barman-cloud/docs/
    instanceSidecarConfiguration:
      # -- Environment variables passed to the Barman Cloud sidecar (defaults disable AWS S3 checksums for non-AWS S3 compatibility; see cloudnative-pg#8599)
      env:
        - name: AWS_REQUEST_CHECKSUM_CALCULATION
          value: when_required
        - name: AWS_RESPONSE_CHECKSUM_VALIDATION
          value: when_required
      # -- Resource requests and limits for the Barman Cloud sidecar container
      resources: {}
      #  requests:
      #    cpu: 10m
      #    memory: 64Mi
      # -- Retention policy enforcement check interval in seconds (leave null for plugin default)
      retentionPolicyIntervalSeconds: null
      # -- Log level for the Barman Cloud sidecar (`error`, `warning`, `info`, `debug`, `trace`)
      logLevel: ""
      # -- Additional command-line arguments appended to the Barman Cloud sidecar container
      additionalContainerArgs: []

    # -- Specificies if this backup will do WALs
    isWALArchiver: true

    # -- Storage
    wal:
      # -- WAL compression method. One of `` (for no compression), `gzip`, `bzip2` or `snappy`.
      compression: snappy

      # -- Whether to instruct the storage provider to encrypt WAL files. One of `` (use the storage container default), `AES256` or `aws:kms`.
      encryption: ""

      # -- Number of WAL files to be archived or restored in parallel.
      maxParallel: 1

    data:
      # -- Data compression method. One of `` (for no compression), `gzip`, `bzip2` or `snappy`.
      compression: snappy

      # -- Whether to instruct the storage provider to encrypt data files. One of `` (use the storage container default), `AES256` or `aws:kms`.
      encryption: ""

      # -- Number of data files to be archived or restored in parallel.
      jobs: 1

  # -- Scheduled backup configuration
  scheduledBackup:
    enabled: true

    # -- Start backup on deployment
    immediate: true

    # -- Temporarily stop scheduled backups from running
    suspend: false

    # -- Schedule in cron format
    schedule: "0 0 0 * * *"

    # -- Backup owner reference
    backupOwnerReference: ""

    # -- Backup method, can be `barman-cloud.cloudnative-pg.io` (default)
    plugin: ""

    # -- Target instance to take the backup from: `prefer-standby` (offloads IOPS from primary, falls back to primary on single-instance clusters) or `primary`
    target: prefer-standby

# -- Optional namespaced ImageCatalog managed by this chart.
# When `create: true` and `images` is non-empty (and `cluster.image` is empty), the chart creates an
# `ImageCatalog` resource and points `Cluster.spec.imageCatalogRef` to it automatically.
# See: https://cloudnative-pg.io/documentation/current/image_catalog/
imageCatalog:
  # -- Whether to create a namespaced ImageCatalog resource
  create: false
  # -- Override the ImageCatalog resource name (defaults to `cluster.name`)
  name: ""
  # -- List of PostgreSQL major version images (each entry: `major`, `image`, optional `extensions`)
  images: []
  #  - major: 19
  #    image: ghcr.io/cloudnative-pg/postgresql:19.0-standard-trixie@sha256:...
  #    extensions: []
  # -- Optional list of component images such as PgBouncer (each entry: `key`, `image`)
  componentImages: []
  #  - key: pgbouncer
  #    image: ghcr.io/cloudnative-pg/pgbouncer:1.25.1

# -- Role management configuration.
# Define a list of roles to be managed by the operator via DatabaseRole CRDs.
# See: https://cloudnative-pg.io/documentation/current/cloudnative-pg.v1/#postgresql-cnpg-io-v1-DatabaseRole
# Example:
# roles:
#   - name: my_role
#     ensure: present
#     login: true
#     connectionLimit: 10
#     inRoles:
#       - another_role
roles: []

# -- Database management configuration.
# Define a list of databases, schemas, and extensions to be managed by the operator.
# See: https://cloudnative-pg.io/documentation/current/cloudnative-pg.v1/#postgresql-cnpg-io-v1-Database
# Example:
# databases:
#   - name: app
#     ensure: present
#     owner: app
#     schemas:
#       - name: myschema
#         owner: app
#     extensions:
#       - name: pg_search
#         version: "0.15.21"
databases: []

# -- List of PgBouncer poolers to deploy alongside the cluster.
# See: https://cloudnative-pg.io/documentation/current/cloudnative-pg.v1/#postgresql-cnpg-io-v1-Pooler
# Example:
# poolers:
#   - name: rw
#     type: rw
#     poolMode: transaction
#     instances: 3
#     paused: false
#     # image: ghcr.io/cloudnative-pg/pgbouncer:1.25.1
#     imageCatalogRef:
#       apiGroup: postgresql.cnpg.io
#       kind: ClusterImageCatalog
#       name: postgresql-standard-trixie
#       key: pgbouncer
#     deploymentStrategy:
#       type: RollingUpdate
#       rollingUpdate:
#         maxUnavailable: 1
#     serviceAccountName: custom-pooler-sa
#     serviceTemplate:
#       metadata:
#         annotations:
#           example.com/pooler: "true"
#       spec:
#         type: ClusterIP
#     parameters:
#       max_client_conn: "1000"
#       default_pool_size: "25"
#     monitoring:
#       enabled: true
#       podMonitor:
#         enabled: true
#   - name: ro
#     type: ro
#     poolMode: transaction
#     instances: 3
#     parameters:
#       max_client_conn: "1000"
#       default_pool_size: "25"
poolers: []

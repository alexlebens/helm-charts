suite: test Pooler generation
templates:
  - pooler.yaml
tests:
  - it: should not generate a Pooler by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should generate a Pooler when defined in poolers
    set:
      poolers:
        - name: read-only
          instances: 2
          type: ro
          poolMode: session
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Pooler
      - equal:
          path: spec.instances
          value: 2
      - equal:
          path: spec.pgbouncer.poolMode
          value: session
      - matchRegex:
          path: spec.cluster.name
          pattern: .*-cluster

  - it: should generate a Pooler with monitoring enabled
    set:
      poolers:
        - name: rw
          instances: 3
          type: rw
          poolMode: transaction
          monitoring:
            enabled: true
            podMonitor:
              enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.monitoring.enablePodMonitor
          value: true

  - it: should generate multiple Pooler resources
    set:
      poolers:
        - name: p1
          instances: 1
        - name: p2
          instances: 2
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: RELEASE-NAME-postgres-pooler-p1
        documentIndex: 0
      - equal:
          path: metadata.name
          value: RELEASE-NAME-postgres-pooler-p2
        documentIndex: 1

  - it: should configure imageCatalogRef on Pooler when specified
    set:
      poolers:
        - name: rw
          instances: 2
          type: rw
          poolMode: transaction
          imageCatalogRef:
            apiGroup: postgresql.cnpg.io
            kind: ClusterImageCatalog
            name: postgresql-standard-trixie
            key: pgbouncer
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.pgbouncer.imageCatalogRef.apiGroup
          value: postgresql.cnpg.io
      - equal:
          path: spec.pgbouncer.imageCatalogRef.kind
          value: ClusterImageCatalog
      - equal:
          path: spec.pgbouncer.imageCatalogRef.name
          value: postgresql-standard-trixie
      - equal:
          path: spec.pgbouncer.imageCatalogRef.key
          value: pgbouncer

  - it: should omit optional deploymentStrategy, serviceAccountName, serviceTemplate, paused, and image by default
    set:
      poolers:
        - name: rw
          instances: 2
    asserts:
      - notExists:
          path: spec.deploymentStrategy
      - notExists:
          path: spec.serviceAccountName
      - notExists:
          path: spec.serviceTemplate
      - notExists:
          path: spec.pgbouncer.paused
      - notExists:
          path: spec.pgbouncer.image

  - it: should configure deploymentStrategy, serviceAccountName, and serviceTemplate on Pooler
    set:
      poolers:
        - name: rw
          instances: 2
          type: rw
          poolMode: transaction
          deploymentStrategy:
            type: RollingUpdate
            rollingUpdate:
              maxUnavailable: 1
          serviceAccountName: custom-pooler-sa
          serviceTemplate:
            metadata:
              annotations:
                example.com/pooler: "true"
            spec:
              type: ClusterIP
    asserts:
      - equal:
          path: spec.deploymentStrategy.type
          value: RollingUpdate
      - equal:
          path: spec.deploymentStrategy.rollingUpdate.maxUnavailable
          value: 1
      - equal:
          path: spec.serviceAccountName
          value: custom-pooler-sa
      - equal:
          path: spec.serviceTemplate.metadata.annotations["example.com/pooler"]
          value: "true"
      - equal:
          path: spec.serviceTemplate.spec.type
          value: ClusterIP

  - it: should configure paused and direct image on Pooler
    set:
      poolers:
        - name: ro
          instances: 2
          type: ro
          paused: true
          image: ghcr.io/cloudnative-pg/pgbouncer:1.25.1
    asserts:
      - equal:
          path: spec.pgbouncer.paused
          value: true
      - equal:
          path: spec.pgbouncer.image
          value: ghcr.io/cloudnative-pg/pgbouncer:1.25.1

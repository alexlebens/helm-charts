suite: test Recovery generation
templates:
  - cluster.yaml
  - external-secret.yaml
  - object-store.yaml
tests:
  - it: should generate recovery method import
    set:
      backup:
        objectStore:
          enabled: false
      mode: recovery
      recovery:
        method: import
        import:
          type: monolith
          source:
            host: "postgres-host"
            port: "5432"
            username: "postgres"
            sslMode: "require"
    asserts:
      - isKind:
          of: Cluster
        template: cluster.yaml
      - isNotNullOrEmpty:
          path: spec.bootstrap.initdb.import
        template: cluster.yaml
      - isNotNullOrEmpty:
          path: spec.externalClusters
        template: cluster.yaml
      - equal:
          path: spec.externalClusters[0].name
          value: importSource
        template: cluster.yaml

  - it: should generate recovery method backup
    set:
      backup:
        objectStore:
          enabled: false
      mode: recovery
      recovery:
        method: backup
        backup:
          backupName: "my-backup"
    asserts:
      - isKind:
          of: Cluster
        template: cluster.yaml
      - isNotNullOrEmpty:
          path: spec.bootstrap.recovery.backup.name
        template: cluster.yaml
      - equal:
          path: spec.bootstrap.recovery.backup.name
          value: my-backup
        template: cluster.yaml

  - it: should generate recovery method objectStore
    set:
      backup:
        objectStore:
          enabled: false
      mode: recovery
      recovery:
        method: objectStore
        objectStore:
          enabled: true
          index: 1
          endpointURL: "https://s3.example.com"
          endpointCredentials:
            createExternalSecret: true
            externalSecretCredentialPath: "secret/path"
    asserts:
      - isKind:
          of: Cluster
        template: cluster.yaml
      - isNotNullOrEmpty:
          path: spec.bootstrap.recovery.source
        template: cluster.yaml
      - matchRegex:
          path: spec.bootstrap.recovery.source
          pattern: -backup-1$
        template: cluster.yaml
      - isNotNullOrEmpty:
          path: spec.externalClusters
        template: cluster.yaml
      - equal:
          path: spec.externalClusters[0].plugin.name
          value: barman-cloud.cloudnative-pg.io
        template: cluster.yaml
      - isKind:
          of: ExternalSecret
        template: external-secret.yaml
      - isKind:
          of: ObjectStore
        template: object-store.yaml

  - it: should support pitrTarget in recovery
    set:
      backup:
        objectStore:
          enabled: false
      mode: recovery
      recovery:
        method: backup
        backup:
          backupName: "my-backup"
          pitrTarget:
            time: "2024-01-01T00:00:00Z"
    asserts:
      - equal:
          path: spec.bootstrap.recovery.recoveryTarget.targetTime
          value: 2024-01-01T00:00:00Z
        template: cluster.yaml

  - it: should generate CA ExternalSecret for recovery
    set:
      backup:
        objectStore:
          enabled: false
      mode: recovery
      recovery:
        method: objectStore
        objectStore:
          enabled: true
          endpointURL: "https://s3.example.com"
          endpointCA:
            createExternalSecret: true
            externalSecretCredentialPath: "ca/secret/path"
    asserts:
      - isKind:
          of: ExternalSecret
        template: external-secret.yaml
        documentIndex: 2
      - equal:
          path: spec.data[0].remoteRef.key
          value: ca/secret/path
        template: external-secret.yaml
        documentIndex: 2

  - it: should scope recovery destinationPath and serverName using recovery.objectStore.clusterName
    set:
      backup:
        objectStore:
          enabled: false
      mode: recovery
      recovery:
        method: objectStore
        objectStore:
          enabled: true
          clusterName: legacy-postgres
          index: 1
    asserts:
      - equal:
          path: spec.configuration.destinationPath
          value: s3://postgres-backups/cl01tl/NAMESPACE/legacy-postgres-cluster
        template: object-store.yaml
      - equal:
          path: spec.bootstrap.recovery.source
          value: legacy-postgres-pg19-backup-1
        template: cluster.yaml
      - equal:
          path: spec.externalClusters[0].plugin.parameters.serverName
          value: legacy-postgres-pg19-backup-1
        template: cluster.yaml

  - it: should allow explicit recovery serverNameOverride
    set:
      backup:
        objectStore:
          enabled: false
      mode: recovery
      recovery:
        method: objectStore
        objectStore:
          enabled: true
          serverNameOverride: app-postgresql-18-backup-1
    asserts:
      - equal:
          path: spec.bootstrap.recovery.source
          value: app-postgresql-18-backup-1
        template: cluster.yaml
      - equal:
          path: spec.externalClusters[0].plugin.parameters.serverName
          value: app-postgresql-18-backup-1
        template: cluster.yaml

  - it: should render default Barman sidecar env and support resources on recovery ObjectStore
    set:
      backup:
        objectStore:
          enabled: false
      mode: recovery
      recovery:
        method: objectStore
        objectStore:
          enabled: true
          instanceSidecarConfiguration:
            resources:
              requests:
                cpu: 15m
                memory: 96Mi
    asserts:
      - equal:
          path: spec.instanceSidecarConfiguration.env[0].name
          value: AWS_REQUEST_CHECKSUM_CALCULATION
        template: object-store.yaml
      - equal:
          path: spec.instanceSidecarConfiguration.resources.requests.cpu
          value: 15m
        template: object-store.yaml
      - equal:
          path: spec.instanceSidecarConfiguration.resources.requests.memory
          value: 96Mi
        template: object-store.yaml

recovery:
  objectStore:
    enabled: true
    instanceSidecarConfiguration:
      env:
        - name: AWS_REQUEST_CHECKSUM_CALCULATION
          value: when_required
        - name: AWS_RESPONSE_CHECKSUM_VALIDATION
          value: when_required
      resources:
        requests:
          cpu: 10m
          memory: 64Mi

backup:
  objectStore:
    enabled: true
    instanceSidecarConfiguration:
      env:
        - name: AWS_REQUEST_CHECKSUM_CALCULATION
          value: when_required
        - name: AWS_RESPONSE_CHECKSUM_VALIDATION
          value: when_required
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
      retentionPolicyIntervalSeconds: 3600
  scheduledBackup:
    enabled: true
    target: prefer-standby
    schedule: "0 0 0 * * *"

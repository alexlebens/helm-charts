poolers:
  - name: rw
    type: rw
    poolMode: transaction
    instances: 2
    paused: false
    image: ghcr.io/cloudnative-pg/pgbouncer:1.25.1
    deploymentStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 1
    serviceAccountName: custom-pooler-sa
    serviceTemplate:
      metadata:
        annotations:
          example.com/pooler: "true"
      spec:
        type: ClusterIP
    parameters:
      max_client_conn: "1000"
      default_pool_size: "25"

apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "cluster.name" . }}-cluster
  namespace: {{ include "cluster.namespace" . }}
  {{- with .Values.cluster.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    app.kubernetes.io/name: {{ include "cluster.name" . }}-cluster
    {{- include "cluster.labels" . | nindent 4 }}
spec:
  instances: {{ .Values.cluster.instances }}
  {{- $inheritedAnnotations := include "cluster.inheritedAnnotations" . | fromYaml }}
  {{- $inheritedLabels := dict }}
  {{- if .Values.cluster.inheritedMetadata }}
  {{- $inheritedLabels = .Values.cluster.inheritedMetadata.labels | default dict }}
  {{- end }}
  {{- if or $inheritedAnnotations $inheritedLabels }}
  inheritedMetadata:
    {{- with $inheritedLabels }}
    labels:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with $inheritedAnnotations }}
    annotations:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
  {{- include "cluster.image" . | trim | nindent 2 }}
  imagePullPolicy: {{ .Values.cluster.imagePullPolicy }}
  {{- with .Values.cluster.imagePullSecrets }}
  imagePullSecrets:
    {{- . | toYaml | nindent 4 }}
  {{- end }}
  postgresUID: {{ include "cluster.postgresUID" . }}
  postgresGID: {{ include "cluster.postgresGID" . }}
  storage:
    size: {{ .Values.cluster.storage.size }}
    {{- if not (empty .Values.cluster.storage.storageClass) }}
    storageClass: {{ .Values.cluster.storage.storageClass }}
    {{- end }}
    {{- if not (kindIs "invalid" .Values.cluster.storage.resizeInUseVolumes) }}
    resizeInUseVolumes: {{ .Values.cluster.storage.resizeInUseVolumes }}
    {{- end }}
  {{- if .Values.cluster.walStorage.enabled }}
  walStorage:
    size: {{ .Values.cluster.walStorage.size }}
    {{- if not (empty .Values.cluster.walStorage.storageClass) }}
    storageClass: {{ .Values.cluster.walStorage.storageClass }}
    {{- end }}
    {{- if not (kindIs "invalid" .Values.cluster.walStorage.resizeInUseVolumes) }}
    resizeInUseVolumes: {{ .Values.cluster.walStorage.resizeInUseVolumes }}
    {{- end }}
  {{- end }}
  {{- with .Values.cluster.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.cluster.affinity }}
  affinity:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.cluster.topologySpreadConstraints }}
  topologySpreadConstraints:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.cluster.nodeMaintenanceWindow }}
  nodeMaintenanceWindow:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.cluster.env }}
  env:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.cluster.envFrom }}
  envFrom:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if .Values.cluster.priorityClassName }}
  priorityClassName: {{ .Values.cluster.priorityClassName }}
  {{- end }}
  primaryUpdateMethod: {{ .Values.cluster.primaryUpdateMethod }}
  primaryUpdateStrategy: {{ .Values.cluster.primaryUpdateStrategy }}
  {{- range $field := list "startDelay" "stopDelay" "smartShutdownTimeout" "switchoverDelay" "failoverDelay" }}
  {{- $val := index $.Values.cluster $field }}
  {{- if not (kindIs "invalid" $val) }}
  {{ $field }}: {{ $val | int }}
  {{- end }}
  {{- end }}
  logLevel: {{ .Values.cluster.logLevel }}
  {{- with .Values.cluster.certificates }}
  certificates:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  enableSuperuserAccess: {{ .Values.cluster.enableSuperuserAccess }}
  {{- with .Values.cluster.superuserSecret }}
  superuserSecret:
    name: {{ . }}
  {{- end }}
  enablePDB: {{ .Values.cluster.enablePDB }}
  {{- with .Values.cluster.seccompProfile }}
  seccompProfile:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.cluster.podSecurityContext }}
  podSecurityContext:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.cluster.securityContext }}
  securityContext:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.cluster.probes }}
  probes:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if and .Values.cluster.serviceAccountName .Values.cluster.serviceAccountTemplate }}
  {{- fail "cluster.serviceAccountName and cluster.serviceAccountTemplate are mutually exclusive!" }}
  {{- end }}
  {{- with .Values.cluster.serviceAccountName }}
  serviceAccountName: {{ . | quote }}
  {{- end }}
  {{- with .Values.cluster.serviceAccountTemplate }}
  serviceAccountTemplate:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.cluster.replicationSlots }}
  replicationSlots:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  postgresql:
    {{- if .Values.cluster.postgresql.shared_preload_libraries }}
    shared_preload_libraries:
      {{- with .Values.cluster.postgresql.shared_preload_libraries }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
    {{- end }}
    {{- with .Values.cluster.postgresql.synchronous }}
    synchronous:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.cluster.postgresql.parameters }}
    parameters:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.cluster.postgresql.pg_hba }}
    pg_hba:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.cluster.postgresql.pg_ident }}
    pg_ident:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.cluster.postgresql.ldap }}
    ldap:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.cluster.postgresql.extensions }}
    extensions:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.cluster.postgresql.promotionTimeout }}
    promotionTimeout: {{ . | int }}
    {{- end }}
    {{- if .Values.cluster.postgresql.enableAlterSystem }}
    enableAlterSystem: true
    {{- end }}
  {{- if or (not (empty .Values.cluster.services)) (not (empty .Values.cluster.roles)) }}
  managed:
    {{- with .Values.cluster.services }}
    services:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.cluster.roles }}
    roles:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
  {{- if .Values.cluster.monitoring.enabled }}
  monitoring:
    disableDefaultQueries: {{ .Values.cluster.monitoring.disableDefaultQueries }}
    {{- if not (empty .Values.cluster.monitoring.customQueries) }}
    customQueriesConfigMap:
      - name: {{ include "cluster.name" . }}-monitoring
        key: custom-queries
    {{- end }}
    {{- if not (empty .Values.cluster.monitoring.customQueriesSecret) }}
    {{- with .Values.cluster.monitoring.customQueriesSecret }}
    customQueriesSecret:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- end }}
  {{- end }}
  {{- if .Values.backup.objectStore.enabled }}
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: {{ ternary true false .Values.backup.objectStore.isWALArchiver }}
      parameters:
        barmanObjectName: {{ include "cluster.backupName" . }}
        serverName: {{ include "cluster.backupServerName" . }}
  {{- end -}}
  {{- include "cluster.bootstrap" . | nindent 2 -}}
  {{- include "cluster.externalClusters" . | nindent 2 -}}

{{- range .Values.poolers }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: {{ include "cluster.name" $ }}-pooler-{{ .name }}
  namespace: {{ include "cluster.namespace" $ }}
  labels:
    app.kubernetes.io/name: {{ include "cluster.name" $ }}-pooler-{{ .name }}
    {{- include "cluster.labels" $ | nindent 4 }}
spec:
  cluster:
    name: {{ include "cluster.name" $ }}-cluster
  instances: {{ .instances }}
  type: {{ default "rw" .type }}
  pgbouncer:
    poolMode: {{ default "session" .poolMode }}
    {{- if and .image .imageCatalogRef }}
    {{- fail "poolers[].image and poolers[].imageCatalogRef are mutually exclusive!" }}
    {{- end }}
    {{- with .image }}
    image: {{ . | quote }}
    {{- end }}
    {{- with .imageCatalogRef }}
    imageCatalogRef:
      apiGroup: {{ .apiGroup | default "postgresql.cnpg.io" }}
      kind: {{ .kind | default "ClusterImageCatalog" }}
      name: {{ .name | required "poolers[].imageCatalogRef.name is required when imageCatalogRef is set" }}
      key: {{ .key | default "pgbouncer" }}
    {{- end }}
    {{- if hasKey . "paused" }}
    paused: {{ .paused }}
    {{- end }}
    {{- with .authQuerySecret }}
    authQuerySecret:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .authQuery }}
    authQuery: {{ . | quote }}
    {{- end }}
    {{- with .parameters }}
    parameters:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .pg_hba }}
    pg_hba:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- with .monitoring }}
  {{- if not (empty .podMonitor) }}
  monitoring:
    enablePodMonitor: {{ and (default false .enabled) (default false .podMonitor.enabled) }}
    {{- with .podMonitor.relabelings }}
    podMonitorRelabelings:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .podMonitor.metricRelabelings }}
    podMonitorMetricRelabelings:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
  {{- end }}
  {{- with .deploymentStrategy }}
  deploymentStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .serviceAccountName }}
  serviceAccountName: {{ . | quote }}
  {{- end }}
  {{- with .serviceTemplate }}
  serviceTemplate:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .template }}
  template:
    {{ . | toYaml | nindent 4 }}
  {{- end }}
{{- end }}

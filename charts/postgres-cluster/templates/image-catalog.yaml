{{- if and .Values.imageCatalog.create (not (empty .Values.imageCatalog.images)) }}
{{- $catalogName := default (include "cluster.name" .) .Values.imageCatalog.name }}
---
apiVersion: postgresql.cnpg.io/v1
kind: ImageCatalog
metadata:
  name: {{ $catalogName }}
  namespace: {{ include "cluster.namespace" . }}
  labels:
    app.kubernetes.io/name: {{ $catalogName }}
    {{- include "cluster.labels" . | nindent 4 }}
spec:
  images:
    {{- range .Values.imageCatalog.images }}
    - major: {{ .major | int }}
      image: {{ .image | quote }}
      {{- with .extensions }}
      extensions:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
  {{- with .Values.imageCatalog.componentImages }}
  componentImages:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}

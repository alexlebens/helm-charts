{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "s3Bucket.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "s3Bucket.secretName" . }}
    {{- include "s3Bucket.labels" . | nindent 4 }}
    {{- with .Values.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecret.storeName | required "externalSecret.storeName is required" }}
  {{- $generatedPath := "" }}
  {{- if .Values.externalSecret.secretPathPrefix }}
  {{- $generatedPath = printf "%s/%s" .Values.externalSecret.secretPathPrefix (include "s3Bucket.name" .) }}
  {{- end }}
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        AWS_ACCESS_KEY_ID: "{{ `{{ .accessKeyId }}` }}"
        AWS_SECRET_ACCESS_KEY: "{{ `{{ .secretAccessKey }}` }}"
        AWS_REGION: "{{ `{{ .region }}` }}"
        access-key-id: "{{ `{{ .accessKeyId }}` }}"
        secret-access-key: "{{ `{{ .secretAccessKey }}` }}"
        region: "{{ `{{ .region }}` }}"
        endpoint: {{ include "s3Bucket.endpoint" . | quote }}
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: {{ .Values.externalSecret.accessKeyIdPath | default .Values.externalSecret.secretPath | default $generatedPath }}
        property: {{ .Values.externalSecret.accessKeyIdProperty }}
    - secretKey: secretAccessKey
      remoteRef:
        key: {{ .Values.externalSecret.secretAccessKeyPath | default .Values.externalSecret.secretPath | default $generatedPath }}
        property: {{ .Values.externalSecret.secretAccessKeyProperty }}
    - secretKey: region
      remoteRef:
        key: {{ .Values.externalSecret.regionKeyPath | default .Values.externalSecret.secretPath | default $generatedPath }}
        property: {{ .Values.externalSecret.regionProperty | default "ACCESS_REGION" }}
{{- end }}

{{- range $backupName, $backupConfig := .Values.backups }}
{{- if and (ne $backupName "image") $backupConfig.enabled $backupConfig.externalSecret.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "s3Bucket.backupSecretName" $ }}-{{ $backupName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "s3Bucket.backupSecretName" $ }}-{{ $backupName }}
    {{- include "s3Bucket.labels" $ | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $backupConfig.externalSecret.storeName }}
  {{- $generatedBackupPath := "" }}
  {{- if $backupConfig.externalSecret.secretPathPrefix }}
  {{- $generatedBackupPath = printf "%s/%s" $backupConfig.externalSecret.secretPathPrefix (include "s3Bucket.name" $) }}
  {{- end }}
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: {{ $backupConfig.externalSecret.accessKeyIdPath | default $backupConfig.externalSecret.secretPath | default $generatedBackupPath }}
        property: {{ $backupConfig.externalSecret.accessKeyIdProperty }}
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: {{ $backupConfig.externalSecret.secretAccessKeyPath | default $backupConfig.externalSecret.secretPath | default $generatedBackupPath }}
        property: {{ $backupConfig.externalSecret.secretAccessKeyProperty }}
    - secretKey: AWS_REGION
      remoteRef:
        key: {{ $backupConfig.externalSecret.regionKeyPath | default $backupConfig.externalSecret.secretPath | default $generatedBackupPath }}
        property: {{ $backupConfig.externalSecret.regionKeyProperty }}
{{- end }}
{{- end }}

{{- $anyBackupEnabled := false }}
{{- range $backupName, $backupConfig := .Values.backups }}
{{- if and (ne $backupName "image") $backupConfig.enabled }}
{{- $anyBackupEnabled = true }}
{{- end }}
{{- end }}
{{- if and .Values.ntfy.enabled .Values.ntfy.externalSecret.enabled $anyBackupEnabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "s3Bucket.backupSecretName" . }}-ntfy
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "s3Bucket.backupSecretName" . }}-ntfy
    {{- include "s3Bucket.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.ntfy.externalSecret.storeName | required "ntfy External Secret store name is required" }}
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      mergePolicy: Merge
      engineVersion: v2
      data:
        ntfy-url: "{{ `{{ .url }}` }}/{{ `{{ .topic }}` }}"
        {{- if .Values.ntfy.externalSecret.tokenPath }}
        ntfy-token: "{{ `{{ .token }}` }}"
        {{- end }}
  data:
    - secretKey: url
      remoteRef:
        key: {{ .Values.ntfy.externalSecret.urlPath }}
        property: {{ .Values.ntfy.externalSecret.urlProperty }}
    - secretKey: topic
      remoteRef:
        key: {{ .Values.ntfy.externalSecret.topicPath }}
        property: {{ .Values.ntfy.externalSecret.topicProperty }}
    {{- if .Values.ntfy.externalSecret.tokenPath }}
    - secretKey: token
      remoteRef:
        key: {{ .Values.ntfy.externalSecret.tokenPath }}
        property: {{ .Values.ntfy.externalSecret.tokenProperty }}
    {{- end }}
{{- end }}

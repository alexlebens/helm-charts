{{- range $backupName, $backupConfig := .Values.backups }}
{{- $cronJob := $backupConfig.cronJob | default dict }}
{{- $cronJobEnabled := true }}
{{- if hasKey $cronJob "enabled" }}
  {{- $cronJobEnabled = $cronJob.enabled }}
{{- end }}
{{- if and (ne $backupName "image") $backupConfig.enabled $cronJobEnabled }}
{{- $destination := $backupConfig.destination | default dict }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "s3Bucket.cronJobName" $ }}-{{ include "s3Bucket.sanitize" $backupName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "s3Bucket.cronJobName" $ }}-{{ include "s3Bucket.sanitize" $backupName }}
    {{- include "s3Bucket.labels" $ | nindent 4 }}
spec:
  schedule: {{ $cronJob.schedule | default $backupConfig.schedule | quote }}
  {{- if $cronJob.timeZone }}
  timeZone: {{ $cronJob.timeZone | quote }}
  {{- end }}
  {{- if hasKey $cronJob "suspend" }}
  suspend: {{ $cronJob.suspend }}
  {{- end }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ $cronJob.successfulJobsHistoryLimit | default 3 }}
  failedJobsHistoryLimit: {{ $cronJob.failedJobsHistoryLimit | default 3 }}
  jobTemplate:
    spec:
      backoffLimit: {{ $cronJob.backoffLimit | default 3 }}
      podReplacementPolicy: Failed
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ include "s3Bucket.cronJobName" $ }}-{{ include "s3Bucket.sanitize" $backupName }}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          {{- with $.Values.backupConfig.podSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumes:
            - name: scripts
              configMap:
                name: {{ include "s3Bucket.cronJobName" $ }}-scripts
                defaultMode: 0755
            - name: tmp
              emptyDir: {}
          containers:
            - name: backup
              image: "{{ $.Values.backupConfig.image.repository }}:{{ $.Values.backupConfig.image.tag }}"
              {{- with $.Values.backupConfig.securityContext }}
              securityContext:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- with $.Values.backupConfig.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              volumeMounts:
                - name: scripts
                  mountPath: /scripts/backup.sh
                  subPath: backup.sh
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              command:
                - /bin/sh
                - /scripts/backup.sh
              env:
                - name: MODE
                  value: {{ $backupConfig.mode | default "sync" | quote }}
                - name: SRC_BUCKET
                  value: {{ include "s3Bucket.name" $ | quote }}
                - name: DEST_BUCKET
                  value: {{ $destination.bucketName | default (include "s3Bucket.name" $) | quote }}
                - name: BACKUP_NAME
                  value: {{ $backupName | quote }}
                - name: JOB_TYPE_TITLE
                  value: ""
                - name: RCLONE_EXCLUDE_FLAGS
                  value: "{{ range ($backupConfig.exclude | default list) }}--exclude {{ . | quote }} {{ end }}"
                - name: NTFY_ENABLED
                  value: {{ $.Values.backupConfig.ntfy.enabled | quote }}
                - name: PRUNE_ENABLED
                  value: {{ and $backupConfig.prune $backupConfig.prune.enabled | default false | quote }}
                - name: PRUNE_AGE
                  value: {{ and $backupConfig.prune $backupConfig.prune.ageToPrune | default "30d" | quote }}
                - name: RCLONE_CONFIG_SRC_TYPE
                  value: "s3"
                - name: RCLONE_CONFIG_SRC_PROVIDER
                  value: "Other"
                - name: RCLONE_CONFIG_SRC_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "s3Bucket.secretName" $ }}
                      key: endpoint
                - name: RCLONE_CONFIG_SRC_REGION
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "s3Bucket.secretName" $ }}
                      key: region
                - name: RCLONE_CONFIG_SRC_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "s3Bucket.secretName" $ }}
                      key: AWS_ACCESS_KEY_ID
                - name: RCLONE_CONFIG_SRC_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "s3Bucket.secretName" $ }}
                      key: AWS_SECRET_ACCESS_KEY
                - name: RCLONE_CONFIG_DEST_TYPE
                  value: "s3"
                - name: RCLONE_CONFIG_DEST_PROVIDER
                  value: {{ $destination.providerType | default "Other" | quote }}
                - name: RCLONE_CONFIG_DEST_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "s3Bucket.backupSecretName" $ }}-{{ include "s3Bucket.sanitize" $backupName }}
                      key: ENDPOINT
                - name: RCLONE_CONFIG_DEST_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "s3Bucket.backupSecretName" $ }}-{{ include "s3Bucket.sanitize" $backupName }}
                      key: AWS_ACCESS_KEY_ID
                - name: RCLONE_CONFIG_DEST_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "s3Bucket.backupSecretName" $ }}-{{ include "s3Bucket.sanitize" $backupName }}
                      key: AWS_SECRET_ACCESS_KEY
                - name: RCLONE_CONFIG_DEST_REGION
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "s3Bucket.backupSecretName" $ }}-{{ include "s3Bucket.sanitize" $backupName }}
                      key: AWS_REGION
                {{- if $.Values.backupConfig.ntfy.enabled }}
                - name: NTFY_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "s3Bucket.backupSecretName" $ }}-ntfy
                      key: ntfy-url
                {{- if $.Values.backupConfig.ntfy.externalSecret.tokenPath }}
                - name: NTFY_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "s3Bucket.backupSecretName" $ }}-ntfy
                      key: ntfy-token
                {{- end }}
                {{- end }}
{{- end }}
{{- end }}

suite: test s3-bucket ExternalSecret
templates:
  - external-secret.yaml
release:
  name: my-bkt
  namespace: ns
tests:
  - it: should render only the bucket ExternalSecret by default
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ExternalSecret
      - equal:
          path: metadata.name
          value: my-bkt-secret
      - equal:
          path: metadata.namespace
          value: ns
      - equal:
          path: spec.secretStoreRef.name
          value: openbao
      - equal:
          path: spec.data[0].remoteRef.key
          value: /cl01tl/garage/keys/my-bkt
      - equal:
          path: spec.data[3].remoteRef.key
          value: /cl01tl/garage/config

  - it: should not render when externalSecret is disabled
    set:
      externalSecret:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should use bucketName override in the secret path
    set:
      bucketName: custom
    asserts:
      - equal:
          path: spec.data[0].remoteRef.key
          value: /cl01tl/garage/keys/custom

  - it: should choose secret paths from the target tier
    set:
      target: a
    asserts:
      - equal:
          path: spec.data[0].remoteRef.key
          value: /ps02sn/garage/keys/my-bkt
      - equal:
          path: spec.data[3].remoteRef.key
          value: /ps02sn/garage/config

  - it: should let secretPath override generated paths
    set:
      externalSecret:
        secretPath: /shared/path
    asserts:
      - equal:
          path: spec.data[0].remoteRef.key
          value: /shared/path
      - equal:
          path: spec.data[2].remoteRef.key
          value: /shared/path

  - it: should render a backup ExternalSecret and ntfy ExternalSecret when a backup is enabled
    set:
      backups:
        a:
          enabled: true
    asserts:
      - hasDocuments:
          count: 3
      - equal:
          path: metadata.name
          value: my-bkt-secret-backup-a
        documentIndex: 1
      - equal:
          path: spec.data[0].remoteRef.key
          value: /ps02sn/garage/keys/my-bkt
        documentIndex: 1
      - equal:
          path: metadata.name
          value: my-bkt-secret-backup-ntfy
        documentIndex: 2

  - it: should skip the backup ExternalSecret when its externalSecret is disabled
    set:
      backups:
        a:
          enabled: true
          externalSecret:
            enabled: false
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: my-bkt-secret-backup-ntfy
        documentIndex: 1

  - it: should skip the ntfy ExternalSecret when ntfy is disabled
    set:
      backups:
        a:
          enabled: true
      backupConfig:
        ntfy:
          enabled: false
    asserts:
      - hasDocuments:
          count: 2

  - it: should add the ntfy token only when tokenPath is set
    set:
      backups:
        a:
          enabled: true
      backupConfig:
        ntfy:
          externalSecret:
            tokenPath: ""
    documentIndex: 2
    asserts:
      - lengthEqual:
          path: spec.data
          count: 2
      - notExists:
          path: spec.target.template.data.ntfy-token

  - it: should match the snapshot with backups enabled
    set:
      backups:
        a:
          enabled: true
    asserts:
      - matchSnapshot: {}

suite: test s3-bucket immediate backup Job
templates:
  - job.yaml
release:
  name: my-bkt
  namespace: ns
tests:
  - it: should not render by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render a Job when backup immediate is set
    set:
      backups:
        a:
          enabled: true
          immediate: true
    asserts:
      - isKind:
          of: Job
      - equal:
          path: metadata.namespace
          value: ns

  - it: should render exclude flags as rclone arguments
    set:
      backups:
        a:
          enabled: true
          immediate: true
          exclude:
            - "*.tmp"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RCLONE_EXCLUDE_FLAGS
            value: "--exclude=*.tmp"

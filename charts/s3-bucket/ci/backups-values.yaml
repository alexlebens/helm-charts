# Exercises every backup tier, immediate jobs, website and CORS configuration.
bucketName: ci-bucket
website:
  enabled: true
cors:
  enabled: true
backups:
  a:
    enabled: true
    immediate: true
    destination:
      bucketName: ci-dest-a
    prune:
      enabled: true
  b:
    enabled: true
    destination:
      bucketName: ci-dest-b
  c:
    enabled: true
    mode: copy
    exclude:
      - "*.tmp"
    destination:
      bucketName: ci-dest-c
  d:
    enabled: true
    destination:
      bucketName: ci-dest-d

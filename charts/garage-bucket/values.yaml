# -- The name of the bucket to create (defaults to .Release.Name)
bucketName: ""

# -- Add additional labels
additionalLabels: {}

# -- GarageCluster reference
garageCluster:
  name: garage-cluster-a
  namespace: garage-operator

# -- Configuration for the GarageReferenceGrant
# Usually the bucket and key are created in the app's namespace.
# This allows the Garage Operator to process them.
# Adjust as needed if cross-namespace access is required.
referenceGrant:
  enabled: true

# -- Bucket Lifecycle Rules (optional)
lifecycle:
  # -- Clean up failed multipart uploads after this many days (highly recommended for backups)
  abortIncompleteMultipartUploadDays: 7

  # -- Delete objects after this many days (set to 0 to disable)
  expirationDays: 0

  # -- Raw rules array to inject custom lifecycle rules
  rules: []

# -- Configuration for importing an existing key via ExternalSecret
# If disabled, Garage operator will auto-generate credentials.
externalSecret:
  enabled: true
  storeName: openbao
  # -- Prefix for auto-generating secretPath as <prefix>/<bucketName>
  secretPathPrefix: /garage/home-infra
  # -- Shared path for both keys (takes precedence over secretPathPrefix)
  secretPath: ""
  # -- Override paths per key (takes precedence over secretPath)
  accessKeyIdPath: ""
  accessKeyIdProperty: ACCESS_KEY_ID
  secretAccessKeyPath: ""
  secretAccessKeyProperty: ACCESS_SECRET_KEY

# -- Bucket Quotas (optional)
quotas:
  maxSize: ""
  maxObjects: ""

# -- Bucket Website (optional)
website:
  enabled: false
  indexDocument: index.html
  errorDocument: error.html

# -- CORS Configuration (optional)
# Applies Cross-Origin Resource Sharing rules to the bucket via a post-install hook.
cors:
  enabled: false

  # -- Default image for the CORS Job
  image:
    repository: amazon/aws-cli
    tag: 2.27.51@sha256:3960aa7002208c9d26cdca90a16416c6f75da95b522da5bed212ef9bf4a804cb

  # -- Raw JSON string of the CORS policy
  policy: ""

# -- Rclone Backup Configuration
# Maps dynamically generated GarageBucket to offsite locations via CronJobs.
backups:
  primary:
    enabled: false

    # -- Default image
    image:
      repository: rclone/rclone
      tag: 1.75.0@sha256:b06aed988cf5967de7c25be5925240983981c757f4ed1ac9d2fa659d51d60548

    # -- CronJob configuration
    cronJob:
      suspend: false
      timeZone: America/Chicago
      schedule: 0 0 * * *
      backoffLimit: 3
      successfulJobsHistoryLimit: 1
      failedJobsHistoryLimit: 3
      activeDeadlineSeconds: 3600

    # -- Destination Bucket
    destination:
      providerType: Other
      endpoint: https://garage-ps10rp.boreal-beaufort.ts.net:3900
      bucketName: ""
      region: garage

    # -- Using ExternalSecret to pull destination credentials from OpenBao/Vault
    externalSecret:
      enabled: true
      storeName: openbao
      # -- Prefix for auto-generating secretPath as <prefix>/<bucketName>
      secretPathPrefix: /garage/home-infra
      # -- Shared path for both keys (takes precedence over secretPathPrefix)
      secretPath: ""
      # -- Override paths per key (takes precedence over secretPath)
      accessKeyIdPath: ""
      accessKeyIdProperty: ACCESS_KEY_ID
      secretAccessKeyPath: ""
      secretAccessKeyProperty: ACCESS_SECRET_KEY

    # -- Prune (optional)
    prune:
      enabled: false
      ageToPrune: "90d"

  secondary:
    enabled: false

    # -- Default image
    image:
      repository: rclone/rclone
      tag: 1.75.0@sha256:b06aed988cf5967de7c25be5925240983981c757f4ed1ac9d2fa659d51d60548

    # -- CronJob configuration
    cronJob:
      suspend: false
      timeZone: America/Chicago
      schedule: 0 0 * * *
      backoffLimit: 3
      successfulJobsHistoryLimit: 1
      failedJobsHistoryLimit: 3
      activeDeadlineSeconds: 3600

    # -- Destination Bucket
    destination:
      providerType: Other
      endpoint: s3.us-east-005.backblazeb2.com
      bucketName: ""
      region: us-east-005

    # -- Using ExternalSecret to pull destination credentials from OpenBao/Vault
    externalSecret:
      enabled: true
      storeName: openbao
      # -- Prefix for auto-generating secretPath as <prefix>/<bucketName>
      secretPathPrefix: /backblaze/home-infra
      # -- Shared path for both keys (takes precedence over secretPathPrefix)
      secretPath: ""
      # -- Override paths per key (takes precedence over secretPath)
      accessKeyIdPath: ""
      accessKeyIdProperty: ACCESS_KEY_ID
      secretAccessKeyPath: ""
      secretAccessKeyProperty: ACCESS_SECRET_KEY

    # -- Prune (optional)
    prune:
      enabled: false
      ageToPrune: "90d"

# -- Security context for CronJob and test pods
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000

# -- Security context for CronJob and test containers
securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# -- Resource requests and limits for CronJob and test containers
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

# -- Ntfy
# Sends notifications for results of backup and prune
ntfy:
  enabled: true
  externalSecret:
    enabled: true
    storeName: openbao
    urlPath: /cl01tl/ntfy/config
    urlProperty: internal-endpoint
    topicPath: /cl01tl/ntfy/topics
    topicProperty: rclone
    tokenPath: /cl01tl/ntfy/users/cl01tl
    tokenProperty: token

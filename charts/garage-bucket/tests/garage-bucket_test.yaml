suite: test garage bucket
templates:
  - garage-bucket.yaml
tests:
  - it: should render with default values
    asserts:
      - isKind:
          of: GarageBucket
      - matchRegex:
          path: metadata.name
          pattern: RELEASE-NAME
      - matchRegex:
          path: metadata.namespace
          pattern: NAMESPACE
      - equal:
          path: spec.clusterRef.name
          value: garage-cluster-a
      - equal:
          path: spec.clusterRef.namespace
          value: garage-operator

  - it: should respect bucketName override
    set:
      bucketName: custom-bucket
    asserts:
      - equal:
          path: metadata.name
          value: custom-bucket

  - it: should correctly generate lifecycle rules
    set:
      lifecycle:
        abortIncompleteMultipartUploadDays: 14
        expirationDays: 30
    asserts:
      - contains:
          path: spec.lifecycle.rules
          content:
            id: expire-incomplete-multipart
            status: Enabled
            abortIncompleteMultipartUploadDays: 14
      - contains:
          path: spec.lifecycle.rules
          content:
            id: expire-old-objects
            status: Enabled
            expirationDays: 30

  - it: should not render quotas when empty
    asserts:
      - notExists:
          path: spec.quota.maxSize
      - notExists:
          path: spec.quota.maxObjects

  - it: should render quotas when set
    set:
      quotas:
        maxSize: "10GB"
        maxObjects: 1000
    asserts:
      - equal:
          path: spec.quota.maxSize
          value: "10GB"
      - equal:
          path: spec.quota.maxObjects
          value: 1000

  - it: should not render website by default
    asserts:
      - notExists:
          path: spec.website

  - it: should render website when enabled
    set:
      website:
        enabled: true
        indexDocument: home.html
        errorDocument: 404.html
    asserts:
      - equal:
          path: spec.website.indexDocument
          value: "home.html"
      - equal:
          path: spec.website.errorDocument
          value: "404.html"

  - it: should include additional labels
    set:
      additionalLabels:
        custom-label: custom-value
    asserts:
      - equal:
          path: metadata.labels.custom-label
          value: custom-value

  - it: should not render lifecycle when all rules are disabled
    set:
      lifecycle:
        abortIncompleteMultipartUploadDays: 0
        expirationDays: 0
        rules: []
    asserts:
      - notExists:
          path: spec.lifecycle

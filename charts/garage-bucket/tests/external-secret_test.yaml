suite: test external secrets
templates:
  - external-secret.yaml
tests:
  - it: should not render by default
    set:
      ntfy:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should render main external secret when enabled
    set:
      ntfy:
        enabled: false
      externalSecret:
        enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-secret
      - equal:
          path: spec.data[0].secretKey
          value: AWS_ACCESS_KEY_ID

  - it: should render backup external secrets
    set:
      backups:
        primary:
          enabled: true
          externalSecret:
            enabled: true
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-secret-backup-primary
        documentIndex: 0

  - it: should render ntfy external secret when enabled with a backup
    set:
      backups:
        primary:
          enabled: true
          externalSecret:
            enabled: false
      ntfy:
        enabled: true
        externalSecret:
          enabled: true
    asserts:
      - containsDocument:
          kind: ExternalSecret
          apiVersion: external-secrets.io/v1
          name: RELEASE-NAME-secret-backup-ntfy
      - equal:
          path: spec.target.template.data.ntfy-url
          value: "{{ .url }}/{{ .topic }}"
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-secret-backup-ntfy

  - it: should not render ntfy external secret when no backups are enabled
    set:
      backups:
        primary:
          enabled: false
        secondary:
          enabled: false
      ntfy:
        enabled: true
        externalSecret:
          enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should include additional labels on main external secret
    set:
      ntfy:
        enabled: false
      externalSecret:
        enabled: true
      additionalLabels:
        custom-label: custom-value
    asserts:
      - equal:
          path: metadata.labels.custom-label
          value: custom-value

  - it: should use required store name validation
    set:
      ntfy:
        enabled: false
      externalSecret:
        enabled: true
        storeName: my-store
    asserts:
      - equal:
          path: spec.secretStoreRef.name
          value: my-store

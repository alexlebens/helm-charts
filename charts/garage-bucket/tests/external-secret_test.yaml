suite: test external secrets
templates:
  - external-secret.yaml
tests:
  - it: should not render when all external secrets are disabled
    set:
      externalSecret:
        enabled: false
      ntfy:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should render main external secret when enabled
    set:
      ntfy:
        enabled: false
      externalSecret:
        enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-secret
      - equal:
          path: spec.data[0].secretKey
          value: AWS_ACCESS_KEY_ID

  - it: should render backup external secrets
    set:
      externalSecret:
        enabled: false
      backups:
        primary:
          enabled: true
          externalSecret:
            enabled: true
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-secret-backup-primary
        documentIndex: 0

  - it: should render ntfy external secret when enabled with a backup
    set:
      externalSecret:
        enabled: false
      backups:
        primary:
          enabled: true
          externalSecret:
            enabled: false
      ntfy:
        enabled: true
        externalSecret:
          enabled: true
    asserts:
      - containsDocument:
          kind: ExternalSecret
          apiVersion: external-secrets.io/v1
          name: RELEASE-NAME-secret-backup-ntfy
      - equal:
          path: spec.target.template.data.ntfy-url
          value: "{{ .url }}/{{ .topic }}"
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-secret-backup-ntfy

  - it: should not render ntfy external secret when no backups are enabled
    set:
      externalSecret:
        enabled: false
      backups:
        primary:
          enabled: false
        secondary:
          enabled: false
      ntfy:
        enabled: true
        externalSecret:
          enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should include additional labels on main external secret
    set:
      ntfy:
        enabled: false
      externalSecret:
        enabled: true
      additionalLabels:
        custom-label: custom-value
    asserts:
      - equal:
          path: metadata.labels.custom-label
          value: custom-value

  - it: should use required store name validation
    set:
      ntfy:
        enabled: false
      externalSecret:
        enabled: true
        storeName: my-store
    asserts:
      - equal:
          path: spec.secretStoreRef.name
          value: my-store

  - it: should use secretPath as fallback for both key paths
    set:
      ntfy:
        enabled: false
      externalSecret:
        enabled: true
        secretPath: vault/my/shared-path
    asserts:
      - equal:
          path: spec.data[0].remoteRef.key
          value: vault/my/shared-path
      - equal:
          path: spec.data[1].remoteRef.key
          value: vault/my/shared-path

  - it: should prefer individual paths over secretPath
    set:
      ntfy:
        enabled: false
      externalSecret:
        enabled: true
        secretPath: vault/my/shared-path
        accessKeyIdPath: vault/my/access-key
        secretAccessKeyPath: vault/my/secret-key
    asserts:
      - equal:
          path: spec.data[0].remoteRef.key
          value: vault/my/access-key
      - equal:
          path: spec.data[1].remoteRef.key
          value: vault/my/secret-key

  - it: should auto-generate path from secretPathPrefix and bucketName
    release:
      name: my-app
    set:
      bucketName: my-bucket
      ntfy:
        enabled: false
      externalSecret:
        enabled: true
        secretPathPrefix: /garage/home-infra
    asserts:
      - equal:
          path: spec.data[0].remoteRef.key
          value: /garage/home-infra/my-bucket
      - equal:
          path: spec.data[1].remoteRef.key
          value: /garage/home-infra/my-bucket

  - it: should prefer secretPath over secretPathPrefix
    set:
      bucketName: my-bucket
      ntfy:
        enabled: false
      externalSecret:
        enabled: true
        secretPathPrefix: /garage/home-infra
        secretPath: /custom/explicit/path
    asserts:
      - equal:
          path: spec.data[0].remoteRef.key
          value: /custom/explicit/path
      - equal:
          path: spec.data[1].remoteRef.key
          value: /custom/explicit/path

  - it: should use secretPathPrefix for backup external secrets
    set:
      bucketName: my-bucket
      externalSecret:
        enabled: false
      backups:
        primary:
          enabled: true
          externalSecret:
            enabled: true
            secretPathPrefix: /backblaze/offsite
    asserts:
      - equal:
          path: spec.data[0].remoteRef.key
          value: /backblaze/offsite/my-bucket
        documentIndex: 0
      - equal:
          path: spec.data[1].remoteRef.key
          value: /backblaze/offsite/my-bucket
        documentIndex: 0

suite: test cron jobs
templates:
  - cron-job.yaml
tests:
  - it: should render primary cron job when enabled
    set:
      backups:
        primary:
          enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: CronJob
      - matchRegex:
          path: metadata.name
          pattern: RELEASE-NAME-backup-primary

  - it: should render multiple cron jobs if configured
    set:
      backups:
        primary:
          enabled: true
          destination:
            bucketName: test-primary
        secondary:
          enabled: true
          destination:
            bucketName: test-secondary
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: CronJob
        documentIndex: 0
      - matchRegex:
          path: metadata.name
          pattern: RELEASE-NAME-backup-primary
        documentIndex: 0
      - isKind:
          of: CronJob
        documentIndex: 1
      - matchRegex:
          path: metadata.name
          pattern: RELEASE-NAME-backup-secondary
        documentIndex: 1

  - it: should include prune commands in backup container when enabled
    set:
      backups:
        primary:
          enabled: true
          prune:
            enabled: true
            ageToPrune: "30d"
    asserts:
      - matchRegex:
          path: spec.jobTemplate.spec.template.spec.containers[0].args[0]
          pattern: "rclone delete"
      - matchRegex:
          path: spec.jobTemplate.spec.template.spec.containers[0].args[0]
          pattern: '--min-age "30d"'

  - it: should only have one container even with prune enabled
    set:
      backups:
        primary:
          enabled: true
          prune:
            enabled: true
            ageToPrune: "30d"
    asserts:
      - lengthEqual:
          path: spec.jobTemplate.spec.template.spec.containers
          count: 1

  - it: should include ntfy env vars when enabled
    set:
      backups:
        primary:
          enabled: true
      ntfy:
        enabled: true
        externalSecret:
          enabled: true
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: NTFY_URL
          any: true
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: NTFY_TOKEN
          any: true

  - it: should include backup name in ntfy notification messages
    set:
      backups:
        primary:
          enabled: true
          prune:
            enabled: true
            ageToPrune: "30d"
      ntfy:
        enabled: true
    asserts:
      - matchRegex:
          path: spec.jobTemplate.spec.template.spec.containers[0].args[0]
          pattern: '✅ Backup - RELEASE-NAME - primary'
      - matchRegex:
          path: spec.jobTemplate.spec.template.spec.containers[0].args[0]
          pattern: 'Job for primary transferred:'
      - matchRegex:
          path: spec.jobTemplate.spec.template.spec.containers[0].args[0]
          pattern: '✅ Prune - RELEASE-NAME - primary'
      - matchRegex:
          path: spec.jobTemplate.spec.template.spec.containers[0].args[0]
          pattern: 'Job for primary pruned:'

  - it: should set automountServiceAccountToken to false
    set:
      backups:
        primary:
          enabled: true
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.automountServiceAccountToken
          value: false

  - it: should include security context from values
    set:
      backups:
        primary:
          enabled: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].securityContext.runAsUser
          value: 1000

  - it: should mount tmp volume
    set:
      backups:
        primary:
          enabled: true
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.volumes
          content:
            name: tmp
            emptyDir: {}
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].volumeMounts
          content:
            name: tmp
            mountPath: /tmp

  - it: should include resource limits from values
    set:
      backups:
        primary:
          enabled: true
      resources:
        requests:
          cpu: 200m
          memory: 256Mi
        limits:
          memory: 1Gi
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].resources.requests.cpu
          value: 200m
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].resources.limits.memory
          value: 1Gi

  - it: should set history limits
    set:
      backups:
        primary:
          enabled: true
          cronJob:
            successfulJobsHistoryLimit: 5
            failedJobsHistoryLimit: 2
    asserts:
      - equal:
          path: spec.successfulJobsHistoryLimit
          value: 5
      - equal:
          path: spec.failedJobsHistoryLimit
          value: 2

  - it: should not render when no backups are enabled
    set:
      backups:
        primary:
          enabled: false
        secondary:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

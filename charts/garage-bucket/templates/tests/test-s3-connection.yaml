---
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "garageBucket.name" . }}-test-connection
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "garageBucket.name" . }}-test-connection
    {{- include "garageBucket.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: rclone-test
      {{- $image := "rclone/rclone:latest" }}
      {{- if and .Values.backups .Values.backups.primary .Values.backups.primary.image }}
      {{- $image = printf "%s:%s" .Values.backups.primary.image.repository .Values.backups.primary.image.tag }}
      {{- end }}
      image: {{ $image | quote }}
      command:
        - /bin/sh
        - -c
      args:
        - |
          echo ">> Testing S3 connection and waiting for bucket to be ready..."
          MAX_RETRIES=12
          RETRY_INTERVAL=10
          BUCKET_NAME="{{ include "garageBucket.name" . }}"

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i: Checking if bucket '$BUCKET_NAME' exists..."
            if rclone lsd "src:" | grep -q "$BUCKET_NAME"; then
              echo ">> Connection successful and bucket is ready!"
              exit 0
            fi
            echo "Bucket not ready or connection failed. Retrying in $RETRY_INTERVAL seconds..."
            sleep $RETRY_INTERVAL
          done

          echo ">> Failed to find bucket '$BUCKET_NAME' after $MAX_RETRIES attempts."
          exit 1
      env:
        - name: RCLONE_CONFIG_SRC_TYPE
          value: "s3"
        - name: RCLONE_CONFIG_SRC_PROVIDER
          value: "Other"
        - name: RCLONE_CONFIG_SRC_ENDPOINT
          value: "http://{{ .Values.garageCluster.name }}.{{ .Values.garageCluster.namespace }}.svc.cluster.local:3900"
        - name: RCLONE_CONFIG_SRC_ENV_AUTH
          value: "false"
        - name: RCLONE_CONFIG_SRC_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: {{ include "garageKey.name" . }}
              key: AWS_ACCESS_KEY_ID
        - name: RCLONE_CONFIG_SRC_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "garageKey.name" . }}
              key: AWS_SECRET_ACCESS_KEY
  restartPolicy: Never

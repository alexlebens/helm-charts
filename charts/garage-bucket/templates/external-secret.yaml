{{- if .Values.externalSecret.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "garageSecret.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "garageSecret.name" . }}
    {{- include "garageBucket.labels" . | nindent 4 }}
    {{- with .Values.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecret.storeName | required "externalSecret.storeName is required" }}
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: {{ .Values.externalSecret.accessKeyIdPath }}
        property: {{ .Values.externalSecret.accessKeyIdProperty }}
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: {{ .Values.externalSecret.secretAccessKeyPath }}
        property: {{ .Values.externalSecret.secretAccessKeyProperty }}
{{- end }}

{{- range $backupName, $backupConfig := .Values.backups }}
{{- if and $backupConfig.enabled $backupConfig.externalSecret.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "garageSecretBackup.name" $ }}-{{ $backupName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "garageSecretBackup.name" $ }}-{{ $backupName }}
    {{- include "garageBucket.labels" $ | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $backupConfig.externalSecret.storeName }}
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: {{ $backupConfig.externalSecret.accessKeyIdPath }}
        property: {{ $backupConfig.externalSecret.accessKeyIdProperty }}
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: {{ $backupConfig.externalSecret.secretAccessKeyPath }}
        property: {{ $backupConfig.externalSecret.secretAccessKeyProperty }}
{{- end }}
{{- end }}

{{- $anyBackupEnabled := false }}
{{- range $backupName, $backupConfig := .Values.backups }}
{{- if $backupConfig.enabled }}
{{- $anyBackupEnabled = true }}
{{- end }}
{{- end }}
{{- if and .Values.ntfy.enabled .Values.ntfy.externalSecret.enabled $anyBackupEnabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "garageSecretBackup.name" . }}-ntfy
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "garageSecretBackup.name" . }}-ntfy
    {{- include "garageBucket.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.ntfy.externalSecret.storeName | required "ntfy External Secret store name is required" }}
  target:
    template:
      mergePolicy: Merge
      engineVersion: v2
      data:
        ntfy-url: "{{ `{{ .url }}` }}/{{ `{{ .topic }}` }}"
        {{- if .Values.ntfy.externalSecret.tokenPath }}
        ntfy-token: "{{ `{{ .token }}` }}"
        {{- end }}
  data:
    - secretKey: url
      remoteRef:
        key: {{ .Values.ntfy.externalSecret.urlPath }}
        property: {{ .Values.ntfy.externalSecret.urlProperty }}
    - secretKey: topic
      remoteRef:
        key: {{ .Values.ntfy.externalSecret.topicPath }}
        property: {{ .Values.ntfy.externalSecret.topicProperty }}
    {{- if .Values.ntfy.externalSecret.tokenPath }}
    - secretKey: token
      remoteRef:
        key: {{ .Values.ntfy.externalSecret.tokenPath }}
        property: {{ .Values.ntfy.externalSecret.tokenProperty }}
    {{- end }}
{{- end }}

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: check-yaml
        exclude: "^charts/.*/(templates|prometheus_rules)/.*$"
        args:
          - --multi
      - id: check-merge-conflict
      - id: check-json
  - repo: local
    hooks:
      - id: helm-docs
        name: helm-docs
        entry: mise exec -- helm-docs
        args:
          - --chart-search-root=charts
          - --template-files=./_templates.gotmpl
          - --template-files=README.md.gotmpl
        language: system
        pass_filenames: false
      - id: shellcheck
        name: shellcheck
        entry: mise exec -- shellcheck
        language: system
        files: ^(\.gitea/scripts/.*\.sh|charts/.*/scripts/.*\.sh|\.mise/(lib/.*\.sh|tasks/.*))$
      - id: jactionlint
        name: jactionlint
        entry: mise exec -- jactionlint --profile correctness
        language: system
        files: ^\.gitea/workflows/.*\.ya?ml$
        args:
          - --config-file
          - .github/actionlint.yaml
          - --ignore
          - 'specifying action "builtin:checkout" in invalid format'
          - --ignore
          - 'undefined variable "gitea"'
          - --ignore
          - 'workflow .* specified at "workflows" of "workflow_run" event is not found'
      - id: prettier
        name: prettier
        entry: mise exec -- prettier --write --ignore-unknown --ignore-path .prettierignore
        exclude: "^charts/.*/(templates|prometheus_rules|README\\.md).*$"
        language: system

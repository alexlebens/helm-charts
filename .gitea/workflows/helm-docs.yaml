name: helm-docs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - "main"
    paths:
      - "_templates.gotmpl"
      - "charts/**/Chart.yaml"
      - "charts/**/README.md.gotmpl"
      - "charts/**/values.yaml"

env:
  GIT_AUTHOR_NAME: "Gitea Actions"
  GIT_AUTHOR_EMAIL: "actions@alexlebens.dev"

jobs:
  helm-docs:
    runs-on: ubuntu-runner
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Tools (mise)
        run: mise install

      - name: Generate Helm Docs
        run: mise run generate:docs

      - name: Check for Documentation Changes
        id: git-diff
        run: |
          if [ -n "$(git status --porcelain 'charts/**/README.md')" ]; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            echo ">> Detected outdated Helm chart documentation:"
            git status --short 'charts/**/README.md'
          else
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo ">> Helm chart documentation is up to date."
          fi

      - name: Commit and Push Documentation (Renovate PRs)
        if: steps.git-diff.outputs.changed == 'true' && startsWith(github.head_ref, 'renovate/')
        env:
          HEAD_REF: ${{ github.head_ref }}
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
          SERVER_URL: ${{ gitea.server_url }}
          REPOSITORY: ${{ gitea.repository }}
        run: |
          echo ">> Automatically committing updated documentation to ${HEAD_REF}..."
          git config user.name "${GIT_AUTHOR_NAME}"
          git config user.email "${GIT_AUTHOR_EMAIL}"
          git add charts/**/README.md
          git commit -m "chore: update helm-docs [skip ci]"
          SCHEME="${SERVER_URL%%://*}"
          HOST="${SERVER_URL#*://}"
          git push "${SCHEME}://${GIT_TOKEN}@${HOST%/}/${REPOSITORY}.git" "HEAD:${HEAD_REF}"

      - name: Verify Documentation (Non-Renovate PRs)
        if: steps.git-diff.outputs.changed == 'true' && !startsWith(github.head_ref, 'renovate/')
        run: |
          echo "::error::Helm docs are out of date. Please run 'mise run generate:docs' and commit the changes."
          git diff charts/**/README.md
          exit 1

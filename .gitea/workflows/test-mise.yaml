name: test-mise

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - ".mise/**"
      - "mise.toml"
      - ".gitea/workflows/test-mise.yaml"

jobs:
  test-mise:
    runs-on: ubuntu-runner
    steps:
      - name: Checkout
        uses: builtin:checkout
        with:
          fetch-depth: 1

      - name: Setup BATS
        uses: bats-core/bats-action@3566550e0f594451ac0f58fcbfdeca93aa29a45e # 4.1.0
        with:
          support-path: ${{ github.workspace }}/.mise/tests/bash/test_helper/bats-support
          assert-path: ${{ github.workspace }}/.mise/tests/bash/test_helper/bats-assert
          detik-install: false
          file-install: false

      - name: Setup Tools (mise)
        run: mise install

      - name: Run Mise BATS Tests
        run: mise run test

      - name: ntfy Failed
        uses: niniyas/ntfy-action@28b287a465c540fb48ff37c0b542fa0efd0ec31e # master
        if: failure()
        with:
          url: "${{ secrets.NTFY_URL }}"
          topic: "${{ vars.NTFY_TOPIC }}"
          title: "🚨 Helm Charts - Mise Script Test Failure"
          priority: 4
          headers: '{"Authorization": "Bearer ${{ secrets.NTFY_CRED }}"}'
          tags: action,failed
          details: "BATS tests failed for .mise tasks and libraries in ${{ github.repository }}."
          icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/png/gitea.png"
          actions:
            '[{"action": "view", "label": "View Run", "url": "${{ vars.PUBLIC_URL }}/${{ github.repository
            }}/actions/runs/${{ github.run_id }}", "clear": true}]'

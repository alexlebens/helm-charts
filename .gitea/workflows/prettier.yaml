name: prettier

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths-ignore:
      - "charts/**/templates/**"
      - "charts/**/prometheus_rules/**"
      - "charts/**/README.md"

env:
  PRETTIER_VERSION: "3.4.2"

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Check Prettier
        run: npx -y prettier@${{ env.PRETTIER_VERSION }} --check .

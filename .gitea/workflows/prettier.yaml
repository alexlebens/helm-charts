name: prettier

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths-ignore:
      - "charts/**/prometheus_rules/**"
      - "charts/**/README.md"
      - "charts/**/templates/**"

jobs:
  prettier:
    runs-on: ubuntu-runner
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Check Prettier
        run: mise exec -- prettier --check .

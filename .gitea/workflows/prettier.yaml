name: prettier

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths-ignore:
      - "charts/**/prometheus_rules/**"
      - "charts/**/README.md"
      - "charts/**/templates/**"

jobs:
  prettier:
    runs-on: ubuntu-runner
    steps:
      - name: Checkout
        uses: builtin:checkout
        with:
          fetch-depth: 1

      - name: Check Prettier
        run: mise exec -- prettier --check .

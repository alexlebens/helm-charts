name: test-workflows

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - ".gitea/workflows/**"
      - ".mise/tasks/check/workflows"
      - ".pre-commit-config.yaml"

jobs:
  lint-workflows:
    runs-on: ubuntu-runner
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Tools (mise)
        run: mise install

      - name: Lint Workflows (jactionlint)
        run: mise run check:workflows

      - name: ntfy Failed
        uses: niniyas/ntfy-action@28b287a465c540fb48ff37c0b542fa0efd0ec31e # master
        if: failure()
        with:
          url: "${{ secrets.NTFY_URL }}"
          topic: "${{ vars.NTFY_TOPIC }}"
          title: "🚨 Workflow Linting Failure"
          priority: 4
          headers: '{"Authorization": "Bearer ${{ secrets.NTFY_CRED }}"}'
          tags: action,failed
          details: "jactionlint failed for workflows in .gitea/workflows/."
          icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/png/gitea.png"
          actions:
            '[{"action": "view", "label": "View Run", "url": "${{ vars.PUBLIC_URL }}/${{ github.repository
            }}/actions/runs/${{ github.run_id }}", "clear": true}]'

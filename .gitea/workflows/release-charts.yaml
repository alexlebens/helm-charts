name: release-charts

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_run:
    workflows: ["test-charts"]
    types: [completed]
    branches:
      - main

  workflow_dispatch:
    inputs:
      chart:
        description: "Specific chart to release (leave empty for all)"
        required: false

jobs:
  detect-charts:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-runner
    outputs:
      matrix: ${{ steps.detect-charts.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Tools (mise)
        run: mise install

      - name: Get Changed Charts
        id: detect-charts
        env:
          INPUT_CHART: ${{ inputs.chart }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ gitea.event.before }}
        run: mise run gitea:detect-charts --mode release

  release:
    needs: [detect-charts]
    if: |
      needs.detect-charts.result == 'success' &&
      needs.detect-charts.outputs.matrix != '[]' &&
      needs.detect-charts.outputs.matrix != ''
    runs-on: ubuntu-runner
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJSON(needs.detect-charts.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Tools (mise)
        run: mise install

      - name: Package & Push Helm Chart
        env:
          HARBOR_HOST: ${{ vars.HARBOR_HOST }}
          HARBOR_USER: ${{ vars.HARBOR_USER }}
          HARBOR_SECRET: ${{ secrets.HARBOR_USER_SECRET }}
          GITEA_SERVER_URL: ${{ gitea.server_url }}
          GITEA_ACTOR: ${{ gitea.actor }}
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: mise run gitea:release-chart --chart "${{ matrix.chart }}"

      - name: Release Helm Chart
        uses: akkuman/gitea-release-action@5a83c90484ef4355121df5eb60558c8ce66e81ac # v1
        with:
          name: ${{ env.CHART_NAME }}-${{ env.CHART_VERSION }}
          tag_name: ${{ env.CHART_NAME }}-${{ env.CHART_VERSION }}
          body_path: release_notes.md
          files: |-
            ${{ env.PACKAGE_PATH }}

      - name: ntfy Success
        uses: niniyas/ntfy-action@28b287a465c540fb48ff37c0b542fa0efd0ec31e # master
        if: success()
        with:
          url: "${{ secrets.NTFY_URL }}"
          topic: "${{ vars.NTFY_TOPIC }}"
          title: "✅ Release Success - ${{ env.CHART_NAME }}"
          priority: 3
          headers: '{"Authorization": "Bearer ${{ secrets.NTFY_CRED }}"}'
          tags: action,successfully,completed
          details: "Helm Chart ${{ env.CHART_NAME }}-${{ env.CHART_VERSION }} has been released!"
          icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/png/gitea.png"
          actions:
            '[{"action": "view", "label": "View Run", "url": "${{ vars.PUBLIC_URL }}/${{ github.repository
            }}/actions/runs/${{ github.run_id }}", "clear": true}]'

      - name: ntfy Failed
        uses: niniyas/ntfy-action@28b287a465c540fb48ff37c0b542fa0efd0ec31e # master
        if: failure()
        with:
          url: "${{ secrets.NTFY_URL }}"
          topic: "${{ vars.NTFY_TOPIC }}"
          title: "🚨 Release Failure - ${{ matrix.chart }}"
          priority: 4
          headers: '{"Authorization": "Bearer ${{ secrets.NTFY_CRED }}"}'
          tags: action,failed
          details: "Helm Chart ${{ matrix.chart }} has failed to be released."
          icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/png/gitea.png"
          actions:
            '[{"action": "view", "label": "View Run", "url": "${{ vars.PUBLIC_URL }}/${{ github.repository
            }}/actions/runs/${{ github.run_id }}", "clear": true}]'
          image: true

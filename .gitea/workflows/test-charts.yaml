name: test-charts

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - "main"
    paths:
      - "charts/**"

  push:
    branches:
      - "main"
    paths:
      - "charts/**"

  workflow_dispatch:

env:
  BASE_BRANCH: "origin/${{ github.base_ref || 'main' }}"

jobs:
  detect-changes:
    runs-on: ubuntu-runner
    outputs:
      matrix: ${{ steps.check-dir-changes.outputs.matrix }}
      charts: ${{ steps.check-dir-changes.outputs.charts }}
      changes-detected: ${{ steps.check-dir-changes.outputs.changes-detected }}
      script-matrix: ${{ steps.check-dir-changes.outputs.script-matrix }}
      scripts-detected: ${{ steps.check-dir-changes.outputs.scripts-detected }}
    steps:
      - name: Checkout
        uses: builtin:checkout
        with:
          fetch-depth: 0

      - name: Setup Tools (mise)
        run: mise install

      - name: Check Directories for Changes
        id: check-dir-changes
        env:
          BASE_BRANCH: ${{ env.BASE_BRANCH }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: mise run gitea:detect-charts --mode test

  lint:
    needs: detect-changes
    runs-on: ubuntu-runner
    if: |
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.changes-detected == 'true'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        chart: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    env:
      CHART: ${{ matrix.chart }}
      FAILED_STAGE: "Initialization"
    steps:
      - name: Checkout
        uses: builtin:checkout
        with:
          fetch-depth: 1

      - name: Setup Tools (mise)
        run: mise install

      - name: Add Repositories
        run: |
          mise run check-chart "${CHART}" --step repos

      - name: Build Chart Dependencies
        run: |
          echo "FAILED_STAGE=Build Chart Dependencies" >> "$GITHUB_ENV"
          mise run check-chart "${CHART}" --step build

      - name: Lint and Test Chart
        run: |
          echo "FAILED_STAGE=Lint and Test Chart" >> "$GITHUB_ENV"
          mise run check-chart "${CHART}" --step lint

      - name: ntfy Failed
        uses: niniyas/ntfy-action@28b287a465c540fb48ff37c0b542fa0efd0ec31e # master
        if: failure()
        with:
          url: "${{ secrets.NTFY_URL }}"
          topic: "${{ vars.NTFY_TOPIC }}"
          title: "🚨 Lint/Test Failure - ${{ matrix.chart }}"
          priority: 3
          headers: '{"Authorization": "Bearer ${{ secrets.NTFY_CRED }}"}'
          tags: action,failed
          details: "Failed for chart: ${{ matrix.chart }} at stage: ${{ env.FAILED_STAGE }}"
          icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/png/gitea.png"
          actions:
            '[{"action": "view", "label": "View Run", "url": "${{ vars.PUBLIC_URL }}/${{ github.repository
            }}/actions/runs/${{ github.run_id }}", "clear": true}]'
          image: true

  test-chart-scripts:
    needs: detect-changes
    runs-on: ubuntu-runner
    if: |
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.scripts-detected == 'true'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        chart: ${{ fromJSON(needs.detect-changes.outputs.script-matrix) }}
    env:
      CHART: ${{ matrix.chart }}
      FAILED_STAGE: "Initialization"
    steps:
      - name: Checkout
        uses: builtin:checkout
        with:
          fetch-depth: 1

      - name: Setup Tools (mise)
        run: mise install

      - name: Lint Chart Scripts (shellcheck)
        run: |
          if [ -d "charts/${CHART}/scripts" ]; then
            echo "FAILED_STAGE=Lint Chart Scripts (shellcheck)" >> "$GITHUB_ENV"
            shopt -s nullglob
            scripts=("charts/${CHART}/scripts/"*.sh)
            shopt -u nullglob
            if [ ${#scripts[@]} -gt 0 ]; then
              echo ">> Linting scripts in charts/${CHART}/scripts/ ..."
              shellcheck "${scripts[@]}"
            fi
          fi

      - name: Check for Chart BATS Tests
        id: check-bats-tests
        run: |
          if [ -d "charts/${CHART}/tests" ] && ls "charts/${CHART}/tests"/*.bats >/dev/null 2>&1; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Chart BATS Tests
        if: steps.check-bats-tests.outputs.has_tests == 'true'
        run: |
          echo "FAILED_STAGE=Run Chart BATS Tests" >> "$GITHUB_ENV"
          echo ">> Running BATS tests for chart ${CHART} ..."
          bats --recursive "charts/${CHART}/tests/"

      - name: ntfy Failed
        uses: niniyas/ntfy-action@28b287a465c540fb48ff37c0b542fa0efd0ec31e # master
        if: failure()
        with:
          url: "${{ secrets.NTFY_URL }}"
          topic: "${{ vars.NTFY_TOPIC }}"
          title: "🚨 Chart Script Failure - ${{ matrix.chart }}"
          priority: 3
          headers: '{"Authorization": "Bearer ${{ secrets.NTFY_CRED }}"}'
          tags: action,failed
          details: "Script testing failed for chart: ${{ matrix.chart }} at stage: ${{ env.FAILED_STAGE }}"
          icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/png/gitea.png"
          actions:
            '[{"action": "view", "label": "View Run", "url": "${{ vars.PUBLIC_URL }}/${{ github.repository
            }}/actions/runs/${{ github.run_id }}", "clear": true}]'
          image: true

  chart-testing:
    needs: [detect-changes, lint]
    runs-on: ubuntu-runner
    if: |
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.changes-detected == 'true'
    env:
      CHARTS: ${{ needs.detect-changes.outputs.charts }}
      FAILED_CHART: ""
      FAILED_STAGE: "Initialization"
    steps:
      - name: Checkout
        uses: builtin:checkout
        with:
          fetch-depth: 0

      - name: Setup Tools (mise)
        run: mise install

      - name: Run Chart Testing
        id: ct-lint
        run: |
          echo "FAILED_STAGE=Chart Testing (ct lint)" >> "$GITHUB_ENV"
          mise run check:chart --charts "${CHARTS}" --target-branch "${{ gitea.event.repository.default_branch }}"

      - name: ntfy Failed
        uses: niniyas/ntfy-action@28b287a465c540fb48ff37c0b542fa0efd0ec31e # master
        if: failure()
        with:
          url: "${{ secrets.NTFY_URL }}"
          topic: "${{ vars.NTFY_TOPIC }}"
          title: "🚨 Chart Testing Failure - Helm Charts"
          priority: 3
          headers: '{"Authorization": "Bearer ${{ secrets.NTFY_CRED }}"}'
          tags: action,failed
          details: "Chart testing failed for: ${{ env.CHARTS }} at stage: ${{ env.FAILED_STAGE }}"
          icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/png/gitea.png"
          actions:
            '[{"action": "view", "label": "View Run", "url": "${{ vars.PUBLIC_URL }}/${{ github.repository
            }}/actions/runs/${{ github.run_id }}", "clear": true}]'
          image: true

  kubeconform:
    needs: [detect-changes, lint]
    runs-on: ubuntu-runner
    if: |
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.changes-detected == 'true'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        chart: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    env:
      CHART: ${{ matrix.chart }}
      FAILED_STAGE: "Initialization"
    steps:
      - name: Checkout
        uses: builtin:checkout
        with:
          fetch-depth: 1

      - name: Setup Tools (mise)
        run: mise install

      - name: Add Repositories
        run: |
          mise run check-chart "${CHART}" --step repos

      - name: Build Chart Dependencies
        run: |
          echo "FAILED_STAGE=Build Chart Dependencies" >> "$GITHUB_ENV"
          mise run check-chart "${CHART}" --step build

      - name: Cache CRD Schemas
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: cache-schemas
        with:
          path: ~/.schemas
          key: ${{ runner.os }}-crd-schemas-v2

      - name: Generate Custom CRD Schemas
        if: steps.cache-schemas.outputs.cache-hit != 'true'
        run: |
          echo "FAILED_STAGE=Generate Custom CRD Schemas" >> "$GITHUB_ENV"
          mise run schemas:generate

      - name: Run Kubeconform
        run: |
          echo "FAILED_STAGE=Run Kubeconform" >> "$GITHUB_ENV"
          mise run check:kubeconform --chart "${CHART}"

      - name: ntfy Failed
        uses: niniyas/ntfy-action@28b287a465c540fb48ff37c0b542fa0efd0ec31e # master
        if: failure()
        with:
          url: "${{ secrets.NTFY_URL }}"
          topic: "${{ vars.NTFY_TOPIC }}"
          title: "🚨 Kubeconform Failure - ${{ matrix.chart }}"
          priority: 3
          headers: '{"Authorization": "Bearer ${{ secrets.NTFY_CRED }}"}'
          tags: action,failed
          details: "Schema validation failed for chart: ${{ matrix.chart }} at stage: ${{ env.FAILED_STAGE }}"
          icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/png/gitea.png"
          actions:
            '[{"action": "view", "label": "View Run", "url": "${{ vars.PUBLIC_URL }}/${{ github.repository
            }}/actions/runs/${{ github.run_id }}", "clear": true}]'
          image: true

  trivy:
    needs: [detect-changes, lint]
    runs-on: ubuntu-runner
    if: |
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.changes-detected == 'true'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        chart: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    env:
      CHART: ${{ matrix.chart }}
      FAILED_STAGE: "Initialization"
    steps:
      - name: Checkout
        uses: builtin:checkout
        with:
          fetch-depth: 1

      - name: Setup Tools (mise)
        run: mise install

      - name: Add Repositories
        run: |
          mise run check-chart "${CHART}" --step repos

      - name: Build Chart Dependencies
        run: |
          echo "FAILED_STAGE=Build Chart Dependencies" >> "$GITHUB_ENV"
          mise run check-chart "${CHART}" --step build

      - name: Run Trivy Security Scan
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN || secrets.GIT_TOKEN }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "FAILED_STAGE=Run Trivy Security Scan" >> "$GITHUB_ENV"
          mise run check:trivy --chart "${CHART}"

      - name: ntfy Failed
        uses: niniyas/ntfy-action@28b287a465c540fb48ff37c0b542fa0efd0ec31e # master
        if: failure()
        with:
          url: "${{ secrets.NTFY_URL }}"
          topic: "${{ vars.NTFY_TOPIC }}"
          title: "🚨 Trivy Security Scan Failure - ${{ matrix.chart }}"
          priority: 3
          headers: '{"Authorization": "Bearer ${{ secrets.NTFY_CRED }}"}'
          tags: action,failed
          details: "Security scan failed for chart: ${{ matrix.chart }} at stage: ${{ env.FAILED_STAGE }}"
          icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/png/gitea.png"
          actions:
            '[{"action": "view", "label": "View Run", "url": "${{ vars.PUBLIC_URL }}/${{ github.repository
            }}/actions/runs/${{ github.run_id }}", "clear": true}]'
          image: true

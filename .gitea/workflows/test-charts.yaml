name: test-charts

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - "main"
    paths:
      - "charts/**"

  push:
    branches:
      - "main"
    paths:
      - "charts/**"

  workflow_dispatch:

env:
  BASE_BRANCH: "origin/${{ github.base_ref || 'main' }}"
  CT_VERSION: "v3.15.0"
  YAMALE_VERSION: "6.1.0"
  YAMLLINT_VERSION: "1.38.0"

jobs:
  detect-changes:
    runs-on: ubuntu-runner
    outputs:
      matrix: ${{ steps.check-dir-changes.outputs.matrix }}
      charts: ${{ steps.check-dir-changes.outputs.charts }}
      changes-detected: ${{ steps.check-dir-changes.outputs.changes-detected }}
    steps:
      - name: Checkout
        uses: builtin:checkout
        with:
          fetch-depth: 0

      - name: Check Directories for Changes
        id: check-dir-changes
        env:
          BASE_BRANCH: ${{ env.BASE_BRANCH }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: ./.gitea/scripts/detect-helm-changes.sh

  lint:
    needs: detect-changes
    runs-on: ubuntu-runner
    if: |
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.changes-detected == 'true'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        chart: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    env:
      CHART: ${{ matrix.chart }}
      FAILED_STAGE: "Initialization"
    steps:
      - name: Checkout
        uses: builtin:checkout
        with:
          fetch-depth: 1

      - name: Add Repositories
        run: |
          echo "FAILED_STAGE=Add Repositories" >> "$GITHUB_ENV"
          ./.gitea/scripts/helm-add-repos.sh --chart "${CHART}"

      - name: Build Chart Dependencies
        run: |
          echo "FAILED_STAGE=Build Chart Dependencies" >> "$GITHUB_ENV"
          echo ">> Building dependencies for ${CHART} ..."
          helm dependency build "charts/${CHART}" --skip-refresh

      - name: Lint Helm Charts
        run: |
          echo "FAILED_STAGE=Lint Helm Charts" >> "$GITHUB_ENV"
          echo ">> Linting ${CHART} ..."
          helm lint "charts/${CHART}" --namespace "${CHART}"

      - name: Cache Helm Plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: cache-helm-plugins
        with:
          path: ~/.local/share/helm/plugins
          key: helm-plugins-${{ runner.os }}-unittest

      - name: Install Helm Unittest Plugin
        if: steps.cache-helm-plugins.outputs.cache-hit != 'true'
        run: |
          echo "FAILED_STAGE=Install Helm Unittest Plugin" >> "$GITHUB_ENV"
          helm plugin install https://github.com/helm-unittest/helm-unittest.git --verify=false

      - name: Run Helm Unittest
        run: |
          echo "FAILED_STAGE=Run Helm Unittest" >> "$GITHUB_ENV"
          if [ -d "charts/${CHART}/tests" ]; then
            echo ">> Running helm unittest for ${CHART} ..."
            (cd "charts/${CHART}" && helm unittest .)
          fi

      - name: ntfy Failed
        uses: niniyas/ntfy-action@28b287a465c540fb48ff37c0b542fa0efd0ec31e # master
        if: failure()
        with:
          url: "${{ secrets.NTFY_URL }}"
          topic: "${{ vars.NTFY_TOPIC }}"
          title: "🚨 Lint/Test Failure - ${{ matrix.chart }}"
          priority: 3
          headers: '{"Authorization": "Bearer ${{ secrets.NTFY_CRED }}"}'
          tags: action,failed
          details: "Failed for chart: ${{ matrix.chart }} at stage: ${{ env.FAILED_STAGE }}"
          icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/png/gitea.png"
          actions:
            '[{"action": "view", "label": "View Run", "url": "${{ vars.PUBLIC_URL }}/${{ github.repository
            }}/actions/runs/${{ github.run_id }}", "clear": true}]'
          image: true

  chart-testing:
    needs: [detect-changes, lint]
    runs-on: ubuntu-runner
    if: |
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.changes-detected == 'true'
    env:
      CHARTS: ${{ needs.detect-changes.outputs.charts }}
      FAILED_CHART: ""
      FAILED_STAGE: "Initialization"
    steps:
      - name: Checkout
        uses: builtin:checkout
        with:
          fetch-depth: 0

      - name: Add Repositories
        run: |
          echo "FAILED_STAGE=Add Repositories" >> "$GITHUB_ENV"
          ./.gitea/scripts/helm-add-repos.sh --charts "${CHARTS}"

      - name: Run Chart Testing
        id: ct-lint
        run: |
          echo "FAILED_STAGE=Chart Testing (ct lint)" >> "$GITHUB_ENV"
          ./.gitea/scripts/install-ct.sh
          ct lint --validate-maintainers=false --target-branch ${{ gitea.event.repository.default_branch }}

      - name: ntfy Failed
        uses: niniyas/ntfy-action@28b287a465c540fb48ff37c0b542fa0efd0ec31e # master
        if: failure()
        with:
          url: "${{ secrets.NTFY_URL }}"
          topic: "${{ vars.NTFY_TOPIC }}"
          title: "🚨 Chart Testing Failure - Helm Charts"
          priority: 3
          headers: '{"Authorization": "Bearer ${{ secrets.NTFY_CRED }}"}'
          tags: action,failed
          details: "Chart testing failed for: ${{ env.CHARTS }} at stage: ${{ env.FAILED_STAGE }}"
          icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/png/gitea.png"
          actions:
            '[{"action": "view", "label": "View Run", "url": "${{ vars.PUBLIC_URL }}/${{ github.repository
            }}/actions/runs/${{ github.run_id }}", "clear": true}]'
          image: true

  kubeconform:
    needs: [detect-changes, lint]
    runs-on: ubuntu-runner
    if: |
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.changes-detected == 'true'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        chart: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    env:
      CHART: ${{ matrix.chart }}
      FAILED_STAGE: "Initialization"
    steps:
      - name: Checkout
        uses: builtin:checkout
        with:
          fetch-depth: 1

      - name: Add Repositories
        run: |
          echo "FAILED_STAGE=Add Repositories" >> "$GITHUB_ENV"
          ./.gitea/scripts/helm-add-repos.sh --chart "${CHART}"

      - name: Build Chart Dependencies
        run: |
          echo "FAILED_STAGE=Build Chart Dependencies" >> "$GITHUB_ENV"
          echo ">> Building dependencies for ${CHART} ..."
          helm dependency build "charts/${CHART}" --skip-refresh

      - name: Cache CRD Schemas
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: cache-schemas
        with:
          path: ~/.schemas
          key: ${{ runner.os }}-crd-schemas-v2

      - name: Generate Custom CRD Schemas
        if: steps.cache-schemas.outputs.cache-hit != 'true'
        run: |
          echo "FAILED_STAGE=Generate Custom CRD Schemas" >> "$GITHUB_ENV"
          ./.gitea/scripts/generate-crd-schemas.sh

      - name: Run Kubeconform
        run: |
          echo "FAILED_STAGE=Run Kubeconform" >> "$GITHUB_ENV"
          ./.gitea/scripts/kubeconform-validate.sh --chart "${CHART}"

      - name: ntfy Failed
        uses: niniyas/ntfy-action@28b287a465c540fb48ff37c0b542fa0efd0ec31e # master
        if: failure()
        with:
          url: "${{ secrets.NTFY_URL }}"
          topic: "${{ vars.NTFY_TOPIC }}"
          title: "🚨 Kubeconform Failure - ${{ matrix.chart }}"
          priority: 3
          headers: '{"Authorization": "Bearer ${{ secrets.NTFY_CRED }}"}'
          tags: action,failed
          details: "Schema validation failed for chart: ${{ matrix.chart }} at stage: ${{ env.FAILED_STAGE }}"
          icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/png/gitea.png"
          actions:
            '[{"action": "view", "label": "View Run", "url": "${{ vars.PUBLIC_URL }}/${{ github.repository
            }}/actions/runs/${{ github.run_id }}", "clear": true}]'
          image: true

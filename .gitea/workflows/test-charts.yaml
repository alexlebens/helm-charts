name: test-charts

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - "main"
    paths:
      - "charts/**"

  push:
    branches:
      - "main"
    paths:
      - "charts/**"

  workflow_dispatch:

env:
  BASE_BRANCH: "origin/${{ github.base_ref || 'main' }}"
  HELM_VERSION: "v4.2.4"
  CT_VERSION: "v3.12.0"
  YAMALE_VERSION: "6.0.0"
  YAMLLINT_VERSION: "1.35.1"
  KUBECONFORM_VERSION: "v0.6.4"

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.check-dir-changes.outputs.matrix }}
      charts: ${{ steps.check-dir-changes.outputs.charts }}
      changes-detected: ${{ steps.check-dir-changes.outputs.changes-detected }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Check Directories for Changes
        id: check-dir-changes
        env:
          BASE_BRANCH: ${{ env.BASE_BRANCH }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: ./.gitea/scripts/detect-helm-changes.sh

  lint:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: |
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.changes-detected == 'true'
    env:
      CHARTS: ${{ needs.detect-changes.outputs.charts }}
      FAILED_CHART: ""
      FAILED_STAGE: "Initialization"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          token: ${{ secrets.GITEA_TOKEN }}
          version: ${{ env.HELM_VERSION }}

      - name: Add Repositories
        run: |
          echo "FAILED_STAGE=Add Repositories" >> $GITHUB_ENV
          ./.gitea/scripts/helm-add-repos.sh --charts "${CHARTS}"

      - name: Verify Chart Lockfiles
        run: |
          echo "FAILED_STAGE=Verify Chart Lockfiles" >> $GITHUB_ENV
          ./.gitea/scripts/helm-verify-lockfiles.sh --charts "${CHARTS}"

      - name: Build Chart Dependencies
        run: |
          echo "FAILED_STAGE=Build Chart Dependencies" >> $GITHUB_ENV
          for CHART in ${CHARTS}; do
            if [ -f "charts/${CHART}/Chart.yaml" ]; then
              echo ">> Building dependencies for ${CHART} ..."
              (cd "charts/${CHART}" && helm dependency build . --skip-refresh) || {
                echo "FAILED_CHART=${CHART}" >> $GITHUB_ENV
                exit 1
              }
            fi
          done

      - name: Lint Helm Charts
        run: |
          echo "FAILED_STAGE=Lint Helm Charts" >> $GITHUB_ENV
          FAILED_CHARTS=""
          for CHART in ${CHARTS}; do
            if [ -f "charts/${CHART}/Chart.yaml" ]; then
              echo ">> Linting ${CHART} ..."
              (cd "charts/${CHART}" && helm lint . --namespace "${CHART}") || FAILED_CHARTS="${FAILED_CHARTS} ${CHART}"
            fi
          done
          if [ -n "${FAILED_CHARTS}" ]; then
            echo "FAILED_CHART=${FAILED_CHARTS}" >> $GITHUB_ENV
            exit 1
          fi

      - name: Cache Helm Plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: cache-helm-plugins
        with:
          path: ~/.local/share/helm/plugins
          key: helm-plugins-${{ runner.os }}-unittest

      - name: Install Helm Unittest Plugin
        if: steps.cache-helm-plugins.outputs.cache-hit != 'true'
        run: |
          echo "FAILED_STAGE=Install Helm Unittest Plugin" >> $GITHUB_ENV
          helm plugin install https://github.com/helm-unittest/helm-unittest.git --verify=false

      - name: Run Helm Unittest
        run: |
          echo "FAILED_STAGE=Run Helm Unittest" >> $GITHUB_ENV
          FAILED_CHARTS=""
          for CHART in ${CHARTS}; do
            if [ -d "charts/${CHART}/tests" ]; then
              echo ">> Running helm unittest for ${CHART} ..."
              (cd "charts/${CHART}" && helm unittest .) || FAILED_CHARTS="${FAILED_CHARTS} ${CHART}"
            fi
          done
          if [ -n "${FAILED_CHARTS}" ]; then
            echo "FAILED_CHART=${FAILED_CHARTS}" >> $GITHUB_ENV
            exit 1
          fi

      - name: ntfy Failed
        uses: niniyas/ntfy-action@96acac57fdc91d4c4f50b78486c1ed6f03f9f61c # master
        if: failure()
        with:
          url: "${{ secrets.NTFY_URL }}"
          topic: "${{ secrets.NTFY_TOPIC }}"
          title: "🚨 Lint/Test Failure - ${{ env.FAILED_CHART || 'Helm Charts' }}"
          priority: 3
          headers: '{"Authorization": "Bearer ${{ secrets.NTFY_CRED }}"}'
          tags: action,failed
          details: "Failed for chart(s): ${{ env.FAILED_CHART || env.CHARTS }} at stage: ${{ env.FAILED_STAGE }}"
          icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/png/gitea.png"
          actions:
            '[{"action": "view", "label": "View Run", "url": "${{ vars.PUBLIC_URL }}/${{ github.repository
            }}/actions/runs/${{ github.run_id }}", "clear": true}]'
          image: true

  chart-testing:
    needs: [detect-changes, lint]
    runs-on: ubuntu-latest
    if: |
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.changes-detected == 'true'
    env:
      CHARTS: ${{ needs.detect-changes.outputs.charts }}
      FAILED_CHART: ""
      FAILED_STAGE: "Initialization"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          token: ${{ secrets.GITEA_TOKEN }}
          version: ${{ env.HELM_VERSION }}

      - name: Add Repositories
        run: |
          echo "FAILED_STAGE=Add Repositories" >> $GITHUB_ENV
          ./.gitea/scripts/helm-add-repos.sh --charts "${CHARTS}"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Cache CT Tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.ct-bin
            ~/.ct
            ~/.cache/pip
          key: tools-${{ runner.os }}-ct-${{ env.CT_VERSION }}-pip-${{ env.YAMLLINT_VERSION }}-${{ env.YAMALE_VERSION }}

      - name: Set up Chart Testing
        run: |
          echo "FAILED_STAGE=Setup Chart Testing" >> $GITHUB_ENV
          ./.gitea/scripts/install-ct.sh

      - name: Run Chart Testing (lint)
        id: ct-lint
        run: |
          echo "FAILED_STAGE=Chart Testing (ct lint)" >> $GITHUB_ENV
          ct lint --validate-maintainers=false --target-branch ${{ gitea.event.repository.default_branch }}

      - name: ntfy Failed
        uses: niniyas/ntfy-action@96acac57fdc91d4c4f50b78486c1ed6f03f9f61c # master
        if: failure()
        with:
          url: "${{ secrets.NTFY_URL }}"
          topic: "${{ secrets.NTFY_TOPIC }}"
          title: "🚨 Chart Testing Failure - Helm Charts"
          priority: 3
          headers: '{"Authorization": "Bearer ${{ secrets.NTFY_CRED }}"}'
          tags: action,failed
          details: "Chart testing failed for: ${{ env.CHARTS }} at stage: ${{ env.FAILED_STAGE }}"
          icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/png/gitea.png"
          actions:
            '[{"action": "view", "label": "View Run", "url": "${{ vars.PUBLIC_URL }}/${{ github.repository
            }}/actions/runs/${{ github.run_id }}", "clear": true}]'
          image: true

  kubeconform:
    needs: [detect-changes, lint]
    runs-on: ubuntu-latest
    if: |
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.changes-detected == 'true'
    env:
      CHARTS: ${{ needs.detect-changes.outputs.charts }}
      FAILED_CHART: ""
      FAILED_STAGE: "Initialization"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          token: ${{ secrets.GITEA_TOKEN }}
          version: ${{ env.HELM_VERSION }}

      - name: Add Repositories
        run: |
          echo "FAILED_STAGE=Add Repositories" >> $GITHUB_ENV
          ./.gitea/scripts/helm-add-repos.sh --charts "${CHARTS}"

      - name: Build Chart Dependencies
        run: |
          echo "FAILED_STAGE=Build Chart Dependencies" >> $GITHUB_ENV
          for CHART in ${CHARTS}; do
            if [ -f "charts/${CHART}/Chart.yaml" ]; then
              echo ">> Building dependencies for ${CHART} ..."
              (cd "charts/${CHART}" && helm dependency build . --skip-refresh) || {
                echo "FAILED_CHART=${CHART}" >> $GITHUB_ENV
                exit 1
              }
            fi
          done

      - name: Cache CRD Schemas
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: cache-schemas
        with:
          path: ~/.schemas
          key: ${{ runner.os }}-crd-schemas-v1

      - name: Set up Python
        if: steps.cache-schemas.outputs.cache-hit != 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Cache Python Dependencies
        if: steps.cache-schemas.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-pyyaml

      - name: Install PyYAML
        if: steps.cache-schemas.outputs.cache-hit != 'true'
        run: |
          echo "FAILED_STAGE=Install PyYAML" >> $GITHUB_ENV
          pip3 install pyyaml --break-system-packages || pip3 install pyyaml

      - name: Generate Custom CRD Schemas
        if: steps.cache-schemas.outputs.cache-hit != 'true'
        run: |
          echo "FAILED_STAGE=Generate Custom CRD Schemas" >> $GITHUB_ENV
          ./.gitea/scripts/generate-crd-schemas.sh

      - name: Cache Kubeconform
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.local/bin/kubeconform
          key: ${{ runner.os }}-kubeconform-${{ env.KUBECONFORM_VERSION }}

      - name: Install Kubeconform
        run: |
          echo "FAILED_STAGE=Install Kubeconform" >> $GITHUB_ENV
          ./.gitea/scripts/install-kubeconform.sh

      - name: Run Kubeconform
        run: |
          echo "FAILED_STAGE=Run Kubeconform" >> $GITHUB_ENV
          ./.gitea/scripts/kubeconform-validate.sh --charts "${CHARTS}"

      - name: ntfy Failed
        uses: niniyas/ntfy-action@96acac57fdc91d4c4f50b78486c1ed6f03f9f61c # master
        if: failure()
        with:
          url: "${{ secrets.NTFY_URL }}"
          topic: "${{ secrets.NTFY_TOPIC }}"
          title: "🚨 Kubeconform Failure - ${{ env.FAILED_CHART || 'Helm Charts' }}"
          priority: 3
          headers: '{"Authorization": "Bearer ${{ secrets.NTFY_CRED }}"}'
          tags: action,failed
          details:
            "Schema validation failed for chart(s): ${{ env.FAILED_CHART || env.CHARTS }} at stage: ${{ env.FAILED_STAGE
            }}"
          icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/png/gitea.png"
          actions:
            '[{"action": "view", "label": "View Run", "url": "${{ vars.PUBLIC_URL }}/${{ github.repository
            }}/actions/runs/${{ github.run_id }}", "clear": true}]'
          image: true
